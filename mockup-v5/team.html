<script>
/* transitions.dev orchestration (04 text swap, 11 group hover) */
function swapText(el,next){if(!el||el.textContent===next)return;const dur=parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--text-swap-dur"))||200;
  el.classList.add("is-exit");setTimeout(()=>{el.textContent=next;el.classList.remove("is-exit");el.classList.add("is-enter-start");void el.offsetHeight;el.classList.remove("is-enter-start");},dur);}
function groupHover(root){if(!root)return;const cs=getComputedStyle(document.documentElement);const num=(n,fb)=>{const v=parseFloat(cs.getPropertyValue(n));return Number.isFinite(v)?v:fb;};const ease=(n,fb)=>cs.getPropertyValue(n).trim()||fb;
  function setShifts(activeIdx,phase){const items=Array.from(root.querySelectorAll(".t-avatar"));const lift=num("--avatar-lift",-4),falloff=num("--avatar-falloff",0.45),scale=num("--avatar-scale",1.05);
    const tf=phase==="out"?ease("--avatar-ease-out","cubic-bezier(0.34, 3.85, 0.64, 1)"):ease("--avatar-ease-in","cubic-bezier(0.22, 1, 0.36, 1)");
    items.forEach((el,i)=>{el.style.transitionTimingFunction=tf;if(activeIdx==null){el.style.setProperty("--shift","0px");el.style.setProperty("--scale-active","1");return;}
      const d=Math.abs(i-activeIdx);el.style.setProperty("--shift",(lift*Math.pow(falloff,d)).toFixed(3)+"px");el.style.setProperty("--scale-active",i===activeIdx?String(scale):"1");});}
  root.addEventListener("mouseover",e=>{const el=e.target.closest(".t-avatar");if(!el||!root.contains(el))return;const items=Array.from(root.querySelectorAll(".t-avatar"));setShifts(items.indexOf(el),"in");});
  root.addEventListener("mouseleave",()=>setShifts(null,"out"));}

const tog=document.getElementById('tog');const paint=()=>{const l=document.getElementById('toglbl'),n=document.documentElement.dataset.theme==='light'?'Dark':'Light';if(l.textContent===n)return;swapText(l,n);};
tog.onclick=()=>{const l=document.documentElement.dataset.theme==='light';if(l)delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme='light';try{localStorage.setItem('dbd-theme',l?'':'light');}catch(e){}paint();};paint();

const Q=new URLSearchParams(location.search);
const TEAM=(Q.get('team')||'MIN').toUpperCase(), PRE=Q.get('state')==='pre', TEAMS=window.DBD_TEAMS, T=TEAMS[TEAM]||TEAMS.MIN, SEASON=2026;
function lum(hex){const [r,g,b]=[1,3,5].map(i=>parseInt(hex.slice(i,i+2),16)/255).map(c=>c<=.03928?c/12.92:Math.pow((c+.055)/1.055,2.4));return .2126*r+.7152*g+.0722*b;}
function contrast(a,b){const [h,l]=[lum(a),lum(b)].sort((x,y)=>y-x);return (h+.05)/(l+.05);}
function accent(t){const bg=document.documentElement.dataset.theme==='light'?'#fffdf8':'#171f38';const ok=c=>c&&contrast(c,bg)>=2.5;return ok(t.c1)?t.c1:ok(t.c2)?t.c2:(bg==='#fffdf8'?'#121417':'#eef0f6');}
document.documentElement.style.setProperty('--team',accent(T));
document.title=`${T.nick} offense | Down by Down`;
document.getElementById('crumb').textContent=`${T.nick} offense`;
try{localStorage.setItem('dbd-last-team',TEAM);}catch(e){}
const pick=document.getElementById('teampick');pick.innerHTML=Object.keys(TEAMS).sort().map(a=>`<option value="${a}"${a===TEAM?' selected':''}>${a}</option>`).join('');
pick.onchange=e=>{location.search='?team='+e.target.value+(PRE?'&state=pre':'');};
const pre=document.getElementById('prepick');pre.checked=PRE;pre.onchange=e=>{location.search='?team='+TEAM+(e.target.checked?'&state=pre':'');};

function loadData(a){return new Promise(res=>{const s=document.createElement('script');s.src=`data/${a}.js`;s.onload=()=>res(window.DBD_DATA);s.onerror=()=>res(null);document.head.appendChild(s);});}
(async()=>{if(PRE){renderPre();return;}let d=await loadData(TEAM),ph=false;if(!d){d=await loadData('MIN');ph=true;}if(d.placeholder)ph=true;boot(d,ph);})();

function renderPre(){document.getElementById('app').innerHTML=`
  <div class="ttitle"><div><p class="kicker">${SEASON} season · Preseason</p><h1 class="withmark">${dbdPennant(TEAM,48)}<span><em>${T.nick}</em> offense</span></h1><p class="sub">Every ${T.nick} offensive snap of the ${SEASON} season, drawn on the field.</p></div></div>
  <div class="empty"><h2>No plays yet</h2><p>The ${SEASON} season kicks off Thursday, September 10. This page fills in the morning after the ${T.nick} play their first game.</p></div>`;}

function boot(RAW,placeholder){
const K=RAW.keys,P=RAW.plays.map((r,i)=>{const o={i};K.forEach((k,j)=>o[k]=r[j]);return o;}),G=RAW.games,gIndex=Object.fromEntries(G.map(g=>[g.id,g])),ABBR=TEAM;
const lastWeek=Math.max(...G.map(g=>g.week)),played=new Set(G.map(g=>g.week)),byes=Array.from({length:lastWeek},(_,i)=>i+1).filter(w=>!played.has(w));
const W=G.filter(g=>g.pf>g.pa).length,L=G.filter(g=>g.pf<g.pa).length,LEAGUE_PASSRATE=0.57;
document.getElementById('app').innerHTML=`
${placeholder?`<div class="panel" style="border-left:3px solid var(--red)"><div class="pb" style="font-size:13px;color:var(--ink-2)"><b style="color:var(--ink)">Mock placeholder.</b> This team's own play file is not in the mock, so Vikings plays are shown under ${T.nick} labels to prove the page is team-agnostic.</div></div>`:''}
<div class="ttitle">
  <div class="t-stagger"><p class="kicker t-stagger-line t-stagger-line--1">${SEASON} season · Weeks 1 to ${lastWeek}${byes.length?` · bye week ${byes.join(', ')}`:''} · ${W}-${L}</p>
  <h1 class="t-stagger-line t-stagger-line--2 withmark">${dbdPennant(TEAM,48)}<span><em>${T.nick}</em> offense</span></h1>

    <div id="view-drive" class="t-panel-slide" data-open="true">
      <div class="legend"><span><i style="background:#f0b429"></i>Run</span><span><i style="background:#5b9cf6"></i>Completion</span><span><i style="background:#9a96a6"></i>Incompletion (air yards)</span><span><i style="background:#e0564b"></i>Sack / INT</span><span><i style="background:#4fd18b"></i>Touchdown</span></div>

    <div id="view-down" class="t-panel-slide" data-open="false" hidden><div id="tend" class="tend"></div></div>
  </section>
  <div class="rail">
    <section class="panel detail"><div class="ph"><span class="lab"><b>Play detail</b></span><span class="badge"><span class="t-text-swap" id="detailmode">Best by EPA</span></span></div><div class="pb" id="detail"></div></section>
    <section class="panel"><div class="ph"><span class="lab"><b>Who gets the ball</b></span><span class="badge">Click to filter</span></div><div class="tw" style="padding:0 14px 6px"><table class="usage" id="usage"></table></div></section>
  </div>
</div>`;

const st={games:new Set(),down:'',type:'',zone:'',sg:'',q:'',pl:'',sel:null,selAuto:true,tab:'drive'};
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),fmt=(n,d=1)=>n==null||isNaN(n)?'-':(+n).toFixed(d),sign=n=>(n>0?'+':'')+fmt(n,2);
const COL={run:'#f0b429',pass:'#5b9cf6',inc:'#9a96a6',bad:'#e0564b',td:'#4fd18b'};
const color=p=>p.td?COL.td:(p.k==='sack'||p.k==='int')?COL.bad:p.k==='inc'?COL.inc:p.pt==='run'?COL.run:COL.pass;
const label=p=>({run:'Run',comp:'Completion',inc:'Incomplete',int:'Interception',sack:'Sack',scramble:'Scramble'}[p.k]||p.k);
const ord=n=>['','1st','2nd','3rd','4th'][n]||n, yardText=yl=>yl==50?'50':yl>50?ABBR+' '+(100-yl):'OPP '+yl;
/* 16 tabs sliding: the pill is positioned from the active button; first paint and resize write it without a transition */
function slidePill(bar,tab,animate){const pill=bar.querySelector('.t-tabs-pill');if(!pill||!tab)return;const go=()=>{pill.style.transform=`translateX(${tab.offsetLeft}px)`;pill.style.width=`${tab.offsetWidth}px`;};
  if(animate){go();return;}const prev=pill.style.transition;pill.style.transition='none';go();void pill.offsetWidth;pill.style.transition=prev;}
function seg(id,key,opts){const el=$(id);el.classList.add('t-tabs');el.setAttribute('role','tablist');
  el.innerHTML='<span class="t-tabs-pill" aria-hidden="true"></span>'+opts.map(([v,t])=>`<button class="t-tab" type="button" role="tab" data-v="${v}" aria-selected="${st[key]===v}">${t}</button>`).join('');
  el.onclick=e=>{const b=e.target.closest('button');if(!b)return;st[key]=b.dataset.v;el.querySelectorAll('button').forEach(x=>x.setAttribute('aria-selected',x===b?'true':'false'));slidePill(el,b,true);render();};
  requestAnimationFrame(()=>slidePill(el,el.querySelector('[aria-selected="true"]'),false));}
window.addEventListener('resize',()=>document.querySelectorAll('.t-tabs').forEach(b=>slidePill(b,b.querySelector('[aria-selected="true"]'),false)));
const SEGS=[['#f-down','down',[['','All'],['1','1st'],['2','2nd'],['3','3rd'],['4','4th']]],['#f-type','type',[['','All'],['pass','Pass'],['run','Run']]],['#f-zone','zone',[['','All'],['own','Own half'],['opp','Opp half'],['rz','Red zone']]],['#f-sg','sg',[['','All'],['1','Shotgun'],['0','Under center']]]];
SEGS.forEach(a=>seg(...a));
function drawGames(){const all=st.games.size===0;$('#games').innerHTML=`<button class="game" type="button" data-g="" aria-pressed="${all}"><span class="wk">SEASON</span><span class="opp">All games</span><span class="res">${G.length} games · ${W}-${L}</span></button>`+
  G.map(g=>`<button class="game" type="button" data-g="${g.id}" aria-pressed="${st.games.has(g.id)}"><span class="wk">WK ${g.week} ${g.home?'vs':'at'}</span><span class="opp">${dbdMark(g.opp,22)}${g.opp}</span><span class="res"><b class="${g.pf>g.pa?'':'l'}">${g.pf>g.pa?'W':'L'}</b> ${g.pf}-${g.pa}</span></button>`).join('');}
$('#games').onclick=e=>{const b=e.target.closest('.game');if(!b)return;const g=b.dataset.g;if(!g)st.games.clear();else st.games.has(g)?st.games.delete(g):st.games.add(g);if(st.games.size===G.length)st.games.clear();render();};
$('#f-q').onchange=e=>{st.q=e.target.value;render();};$('#f-pl').onchange=e=>{st.pl=e.target.value;render();};
$('#reset').onclick=()=>{Object.assign(st,{games:new Set(),down:'',type:'',zone:'',sg:'',q:'',pl:''});SEGS.forEach(([id])=>{const el=$(id);el.querySelectorAll('button').forEach(x=>x.setAttribute('aria-selected',x.dataset.v===''?'true':'false'));slidePill(el,el.querySelector('[data-v=""]'),true);});$('#f-q').value='';render();};
const players=[...new Set(P.map(p=>p.pl).filter(Boolean))].map(n=>[n,P.filter(p=>p.pl===n).length]).sort((a,b)=>b[1]-a[1]);
$('#f-pl').innerHTML='<option value="">All players</option>'+players.map(([n,c])=>`<option value="${esc(n)}">${esc(n)} (${c})</option>`).join('');
const VIEWS=['drive','spray','down'],vt=$('#viewtabs');
VIEWS.forEach(t=>{$('#tab-'+t).onclick=()=>{if(st.tab===t)return;const prev=st.tab;st.tab=t;VIEWS.forEach(x=>$('#tab-'+x).setAttribute('aria-selected',x===t));slidePill(vt,$('#tab-'+t),true);
  const closeDur=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--panel-close-dur'))||350;
  const o=$('#view-'+prev),n=$('#view-'+t);o.dataset.open='false';setTimeout(()=>{o.hidden=true;},closeDur);n.hidden=false;requestAnimationFrame(()=>{n.dataset.open='true';});};});
requestAnimationFrame(()=>slidePill(vt,$('#tab-drive'),false));
function filtered(){return P.filter(p=>(st.games.size===0||st.games.has(p.g))&&(!st.down||p.dn==+st.down)&&(!st.type||p.pt===st.type)&&(!st.zone||(st.zone==='own'&&p.yl>50)||(st.zone==='opp'&&p.yl<=50)||(st.zone==='rz'&&p.yl<=20))&&(st.sg===''||p.sg==+st.sg)&&(!st.q||p.q==+st.q)&&(!st.pl||p.pl===st.pl));}
function tiles(F){const n=F.length,pass=F.filter(p=>p.pt==='pass').length,epa=F.reduce((a,p)=>a+(p.epa||0),0)/(n||1),succ=F.filter(p=>p.succ).length/(n||1),yds=F.reduce((a,p)=>a+(p.yds||0),0),tds=F.filter(p=>p.td).length,fd=F.filter(p=>p.fd).length,expl=F.filter(p=>(p.pt==='pass'&&p.yds>=20)||(p.pt==='run'&&p.yds>=10)).length;
  const t=[['Plays',n,`${pass} pass · ${n-pass} run`],['Pass rate',n?Math.round(pass/n*100)+'%':'-',`league ${Math.round(LEAGUE_PASSRATE*100)}%`],['EPA / play',n?`<span class="${epa>=0?'pos':'neg'}">${sign(epa)}</span>`:'-','above 0 beats expectation'],['Success rate',n?Math.round(succ*100)+'%':'-','good offenses top 45%'],['Yards / play',n?fmt(yds/n):'-',`${yds} total yards`],['Explosive',expl,'20+ pass · 10+ run'],['1st downs / TDs',`${fd} / ${tds}`,'by play']];
  if(!$('#tiles').children.length){$('#tiles').innerHTML=t.map(([l])=>`<div class="tile"><div class="l">${l}</div><div class="v"><span class="t-digit-group"></span></div><div class="s"></div></div>`).join('');}
  [...$('#tiles').children].forEach((tile,i)=>{const [,v,sub]=t[i],g=tile.querySelector('.t-digit-group'),txt=String(v).replace(/<[^>]+>/g,''),cls=/neg/.test(String(v))?'neg':/pos/.test(String(v))?'pos':'';
    tile.querySelector('.s').textContent=sub;g.className='t-digit-group '+cls;if(g.dataset.v===txt)return;g.dataset.v=txt;
    g.classList.remove('is-animating');g.replaceChildren();const chars=txt.split('');chars.forEach((ch,j)=>{const sp=document.createElement('span');sp.className='t-digit';sp.textContent=ch;if(j===chars.length-2)sp.dataset.stagger='1';else if(j===chars.length-1)sp.dataset.stagger='2';g.appendChild(sp);});void g.offsetHeight;g.classList.add('is-animating');});}
function drive(F){const W=760,EZ=40,FW=W-EZ*2,s=FW/100,RH=9,HDR=24,DH=8;let y=8;const rows=[];let lastG=null,lastD=null;
  for(const p of F){if(p.g!==lastG){if(lastG)y+=10;rows.push({hdr:gIndex[p.g],y});y+=HDR;lastG=p.g;lastD=null;}if(p.drv!==lastD){if(lastD!=null)y+=DH;lastD=p.drv;}rows.push({p,y});y+=RH;}
  const H=Math.max(y+12,180),x=yd=>EZ+yd*s;let g=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;min-width:560px" role="img" aria-label="Drive chart of ${F.length} plays">`;
  g+=`<rect x="0" y="0" width="${EZ}" height="${H}" fill="color-mix(in srgb,var(--team) 35%,transparent)"/><rect x="${W-EZ}" y="0" width="${EZ}" height="${H}" fill="rgba(0,0,0,.18)"/>`;
  for(let i=0;i<=100;i+=10)g+=`<line x1="${x(i)}" x2="${x(i)}" y1="0" y2="${H}" stroke="rgba(255,255,255,.22)" stroke-width="${i===50?2:1}"/>`;
  for(let i=10;i<100;i+=10){const lab=i<=50?i:100-i;g+=`<text x="${x(i)}" y="${H-4}" fill="rgba(255,255,255,.75)" font-size="10" text-anchor="middle">${lab}</text>`;}
  g+=`<text x="${EZ/2}" y="${H/2}" fill="rgba(255,255,255,.75)" font-size="11" text-anchor="middle" transform="rotate(-90 ${EZ/2} ${H/2})">${ABBR} GOAL</text><text x="${W-EZ/2}" y="${H/2}" fill="rgba(255,255,255,.75)" font-size="11" text-anchor="middle" transform="rotate(90 ${W-EZ/2} ${H/2})">OPPONENT END ZONE</text>`;
  for(const r of rows){if(r.hdr){const h=r.hdr;g+=`<text x="${EZ+6}" y="${r.y+15}" fill="#fff" font-size="12" font-weight="600">WEEK ${h.week} ${h.home?'VS':'AT'} ${h.opp}  ·  ${h.pf>h.pa?'W':'L'} ${h.pf}-${h.pa}</text>`;continue;}
    const p=r.p,los=100-p.yl,cy=r.y+RH/2;let end=(p.k==='inc'||p.k==='int')?los+(p.air??0):los+(p.yds??0);end=Math.max(-2,Math.min(102,end));const dash=p.k==='inc'?' stroke-dasharray="3 3"':'',sel=st.sel===p.i?' sel':'';
    g+=`<g class="play${sel}" data-i="${p.i}"><rect x="0" y="${r.y}" width="${W}" height="${RH}" fill="transparent"/>`;
    if(p.k==='comp'&&p.air!=null){const ca=Math.max(-2,Math.min(102,los+p.air));g+=`<line x1="${x(los)}" x2="${x(ca)}" y1="${cy}" y2="${cy}" stroke="${color(p)}" stroke-width="2" stroke-opacity=".55" stroke-dasharray="2 2"/><line x1="${x(ca)}" x2="${x(end)}" y1="${cy}" y2="${cy}" stroke="${color(p)}" stroke-width="3" stroke-linecap="round"/>`;}
    else g+=`<line x1="${x(los)}" x2="${x(end)}" y1="${cy}" y2="${cy}" stroke="${color(p)}" stroke-width="3" stroke-linecap="round"${dash}/>`;
    g+=`<circle cx="${x(los)}" cy="${cy}" r="2.2" fill="#fff"/></g>`;}
  if(!F.length)g+=`<text x="${W/2}" y="90" fill="#fff" text-anchor="middle" font-size="14">No plays match these filters.</text>`;$('#drive').innerHTML=g+'</svg>';}
function hash(i){return (i*2654435761%4294967296)/4294967296;}
function passmap(F){const D=F.filter(p=>['comp','inc','int'].includes(p.k)&&p.air!=null),W=360,H=420,T=40,B=30,L=34,R=10,minA=Math.min(-10,Math.floor(Math.min(...D.map(p=>p.air),0)/5)*5),maxA=Math.max(40,...D.map(p=>p.air)),y=a=>T+(maxA-a)/(maxA-minA)*(H-T-B),lw=(W-L-R)/3,lanes={left:0,middle:1,right:2};
  let g=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;background:var(--field);border-radius:4px" role="img" aria-label="Pass target map">`;
  for(let a=-10;a<=maxA;a+=10)g+=`<line x1="${L}" x2="${W-R}" y1="${y(a)}" y2="${y(a)}" stroke="rgba(255,255,255,.22)" stroke-width="${a===0?2:1}"/><text x="${L-6}" y="${y(a)+4}" fill="rgba(255,255,255,.75)" font-size="10" text-anchor="end">${a}</text>`;
  g+=`<text x="${L-6}" y="${T-24}" fill="rgba(255,255,255,.75)" font-size="10" text-anchor="end">air yds</text>`;
  ['Left','Middle','Right'].forEach((n,i)=>{g+=`<text x="${L+lw*i+lw/2}" y="${H-10}" fill="rgba(255,255,255,.75)" font-size="11" text-anchor="middle">${n}</text>`;if(i)g+=`<line x1="${L+lw*i}" x2="${L+lw*i}" y1="${T}" y2="${H-B}" stroke="rgba(255,255,255,.22)" stroke-dasharray="2 4"/>`;});
  const byLane={left:[],middle:[],right:[]};for(const p of D){const li=lanes[p.loc]??1;byLane[p.loc||'middle']?.push(p);const cx=L+lw*li+lw*(.12+.76*hash(p.i+1)),cy=y(p.air);g+=`<g class="play${st.sel===p.i?' sel':''}" data-i="${p.i}"><circle cx="${cx}" cy="${cy}" r="${st.sel===p.i?7:5}" fill="${color(p)}" fill-opacity=".85" stroke="${st.sel===p.i?'#fff':'rgba(0,0,0,.35)'}" stroke-width="${st.sel===p.i?2:1}"/></g>`;}
  Object.entries(byLane).forEach(([k,a])=>{if(!a.length)return;const c=a.filter(p=>p.k==='comp').length,i=lanes[k];g+=`<text x="${L+lw*i+lw/2}" y="${T-24}" fill="#fff" font-size="11" font-weight="600" text-anchor="middle">${c}/${a.length} · ${Math.round(c/a.length*100)}%</text>`;});
  $('#passmap').innerHTML=g+'</svg>';}
function runmap(F){const R=F.filter(p=>p.pt==='run'&&p.k==='run'),cols=[['left','end','L End'],['left','tackle','L Tackle'],['left','guard','L Guard'],['middle',null,'Middle'],['right','guard','R Guard'],['right','tackle','R Tackle'],['right','end','R End']];
  const data=cols.map(([loc,gap,n])=>{const a=R.filter(p=>p.loc===loc&&(loc==='middle'||p.gap===gap));return {n,c:a.length,ypc:a.length?a.reduce((s,p)=>s+(p.yds||0),0)/a.length:0,sr:a.length?a.filter(p=>p.succ).length/a.length:0,epa:a.length?a.reduce((s,p)=>s+(p.epa||0),0)/a.length:0};});
  const W=360,H=420,T=50,B=70,L=10,Rr=10,maxC=Math.max(1,...data.map(d=>d.c)),cw=(W-L-Rr)/7;let g=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;background:var(--field);border-radius:4px" role="img" aria-label="Run gap chart">`;
  g+=`<text x="${W/2}" y="18" fill="rgba(255,255,255,.75)" font-size="10" text-anchor="middle">bar height = carries · label = yards per carry</text>`;
  data.forEach((d,i)=>{const bh=(H-T-B)*d.c/maxC,bx=L+cw*i+5,by=H-B-bh,fill=d.c?(d.epa>=0?COL.td:d.sr>=.4?COL.run:COL.bad):'transparent';g+=`<rect x="${bx}" y="${by}" width="${cw-10}" height="${bh}" rx="2" fill="${fill}" fill-opacity=".85"/>`;
    if(d.c)g+=`<text x="${bx+(cw-10)/2}" y="${by-6}" fill="#fff" font-size="12" font-weight="600" text-anchor="middle">${fmt(d.ypc)}</text>`;
    g+=`<text x="${bx+(cw-10)/2}" y="${H-B+16}" fill="rgba(255,255,255,.75)" font-size="10" text-anchor="middle">${d.n.split(' ')[0]}</text><text x="${bx+(cw-10)/2}" y="${H-B+28}" fill="rgba(255,255,255,.75)" font-size="10" text-anchor="middle">${d.n.split(' ')[1]||''}</text><text x="${bx+(cw-10)/2}" y="${H-B+46}" fill="#fff" font-size="11" text-anchor="middle">${d.c}</text><text x="${bx+(cw-10)/2}" y="${H-B+60}" fill="rgba(255,255,255,.75)" font-size="10" text-anchor="middle">${d.c?Math.round(d.sr*100)+'%':''}</text>`;});
  g+=`<text x="4" y="${H-B+46}" fill="rgba(255,255,255,.75)" font-size="9">n</text><text x="4" y="${H-B+60}" fill="rgba(255,255,255,.75)" font-size="9">SR</text></svg>`;
  $('#runmap').innerHTML=g+`<div class="legend" style="padding:8px 0 0"><span><i style="background:${COL.td}"></i>Positive EPA</span><span><i style="background:${COL.run}"></i>Negative EPA, 40%+ success</span><span><i style="background:${COL.bad}"></i>Under 40% success</span></div>`;}
function tend(F){const B=[['1st & 10+',p=>p.dn==1&&p.togo>=10],['1st & short',p=>p.dn==1&&p.togo<10],['2nd & 7+',p=>p.dn==2&&p.togo>=7],['2nd & 3-6',p=>p.dn==2&&p.togo>=3&&p.togo<7],['2nd & 1-2',p=>p.dn==2&&p.togo<3],['3rd & 7+',p=>p.dn==3&&p.togo>=7],['3rd & 3-6',p=>p.dn==3&&p.togo>=3&&p.togo<7],['3rd & 1-2',p=>p.dn==3&&p.togo<3],['4th down',p=>p.dn==4]];
  const row=(n,a,conv)=>{const ps=a.filter(p=>p.pt==='pass').length,e=a.reduce((s,p)=>s+(p.epa||0),0);return `<tr><td>${n}</td><td>${a.length}</td><td><span class="bar" style="width:${a.length?ps/a.length*50:0}px"></span>${a.length?Math.round(ps/a.length*100)+'%':'-'}</td><td>${a.length?Math.round(a.filter(p=>p.succ).length/a.length*100)+'%':'-'}</td><td class="${e>=0?'pos':'neg'}">${a.length?sign(e/a.length):'-'}</td>${conv!==undefined?`<td>${conv}</td>`:''}</tr>`;};
  const dd=B.map(([n,f])=>{const a=F.filter(f);return row(n,a,(n.startsWith('3rd')||n.startsWith('4th'))&&a.length?Math.round(a.filter(p=>p.fd||p.td).length/a.length*100)+'%':'');}).join('');
  const qs=[1,2,3,4].map(q=>row('Q'+q,F.filter(p=>p.q==q))).join(''),sit=[['Leading',p=>p.sd>0],['Tied',p=>p.sd==0],['Trailing',p=>p.sd<0]].map(([n,f])=>row(n,F.filter(f))).join('');
  $('#tend').innerHTML=`<h4>Down and distance</h4><div class="tw" style="padding:0 14px"><table><tr><th>Situation</th><th>Plays</th><th>Pass rate</th><th>Success</th><th>EPA/play</th><th>Converted</th></tr>${dd}</table></div>
  <div class="sprays"><div><h4 style="margin-left:0">By quarter</h4><table><tr><th>Qtr</th><th>Plays</th><th>Pass</th><th>Success</th><th>EPA</th></tr>${qs}</table></div><div><h4 style="margin-left:0">By game score</h4><table><tr><th>When</th><th>Plays</th><th>Pass</th><th>Success</th><th>EPA</th></tr>${sit}</table></div></div>`;}
function usage(F){const m={};for(const p of F){if(!p.pl)continue;const u=m[p.pl]??={n:p.pl,tg:0,rec:0,car:0,yds:0,epa:0,td:0,rz:0};if(['comp','inc','int'].includes(p.k)){u.tg++;if(p.k==='comp')u.rec++;}else if(p.k==='run'||p.k==='scramble')u.car++;else continue;u.yds+=p.yds||0;u.epa+=p.epa||0;u.td+=p.td||0;if(p.yl<=20)u.rz++;}
  const a=Object.values(m).sort((x,y)=>(y.tg+y.car)-(x.tg+x.car)).slice(0,12);
  $('#usage').innerHTML=`<tr><th>Player</th><th>Tgt</th><th>Rec</th><th>Car</th><th>Yds</th><th>RZ</th><th>EPA</th></tr>`+a.map(u=>`<tr class="clk${st.pl===u.n?' on':''}" data-pl="${esc(u.n)}"><td>${esc(u.n)}</td><td>${u.tg||''}</td><td>${u.rec||''}</td><td>${u.car||''}</td><td>${u.yds}</td><td>${u.rz||''}</td><td class="${u.epa>=0?'pos':'neg'}">${fmt(u.epa,1)}</td></tr>`).join('')+(a.length?'':'<tr><td colspan="7">No plays match.</td></tr>');}
$('#usage').onclick=e=>{const r=e.target.closest('tr[data-pl]');if(!r)return;st.pl=st.pl===r.dataset.pl?'':r.dataset.pl;$('#f-pl').value=st.pl;render();};
function detail(F){let p=st.sel==null?null:P[st.sel];if(p==null||!F.includes(p)){p=F.slice().sort((a,b)=>(b.epa??-9)-(a.epa??-9))[0];st.sel=p?p.i:null;st.selAuto=true;}
  swapText($('#detailmode'),st.selAuto?'Best by EPA':'Clicked');
  if(!p){$('#detail').innerHTML='<p class="note" style="padding:0">No plays match these filters.</p>';return;}
  const g=gIndex[p.g],pills=[`<span class="pill">${label(p)}</span>`];if(p.td)pills.push('<span class="pill good">Touchdown</span>');else if(p.fd)pills.push('<span class="pill good">First down</span>');pills.push(`<span class="pill ${p.succ?'good':'bad'}">${p.succ?'Successful':'Unsuccessful'}</span>`);if(p.sg)pills.push('<span class="pill">Shotgun</span>');
  $('#detail').innerHTML=`<h3>Week ${g.week} ${g.home?'vs':'at'} ${g.opp} · Q${p.q} ${esc(p.t)}</h3><h2>${ord(p.dn)} &amp; ${p.togo} at ${yardText(p.yl)}</h2><div class="meta">${pills.join('')}</div><p class="desc">${esc(p.desc)}</p>
  <dl class="kv"><dt>Yards</dt><dd>${p.yds??0}</dd>${p.air!=null?`<dt>Air yards</dt><dd>${p.air}${p.yac!=null?` + ${p.yac} after catch`:''}</dd>`:''}${p.loc?`<dt>Direction</dt><dd>${p.loc}${p.gap?' '+p.gap:''}${p.len?' · '+p.len:''}</dd>`:''}<dt>EPA</dt><dd class="${(p.epa||0)>=0?'pos':'neg'}">${sign(p.epa||0)}</dd><dt>Score</dt><dd>${p.sd>0?'Up '+p.sd:p.sd<0?'Down '+(-p.sd):'Tied'}</dd></dl>`;}
const tt=$('#tt');
document.addEventListener('mouseover',e=>{const g=e.target.closest('.play');if(!g){tt.classList.remove('is-shown');return;}const p=P[+g.dataset.i],gm=gIndex[p.g];tt.innerHTML=`<b>Wk ${gm.week} ${gm.opp} · Q${p.q} ${esc(p.t)} · ${ord(p.dn)} &amp; ${p.togo}</b><br>${esc(p.desc)}<br><span class="${(p.epa||0)>=0?'pos':'neg'}">EPA ${sign(p.epa||0)}</span>`;tt.classList.add('is-shown');});
document.addEventListener('mousemove',e=>{if(tt.classList.contains('is-shown')){tt.style.left=Math.min(e.clientX+14,innerWidth-330)+'px';tt.style.top=(e.clientY+14)+'px';}});
document.addEventListener('click',e=>{const g=e.target.closest('.play');if(!g)return;st.sel=+g.dataset.i;st.selAuto=false;render();});
function render(){const F=filtered();drawGames();tiles(F);drive(F);passmap(F);runmap(F);tend(F);usage(F);detail(F);}
render();
}
</script>
<script>requestAnimationFrame(()=>document.querySelectorAll(".t-stagger").forEach(b=>b.classList.add("is-shown")));setTimeout(()=>document.documentElement.classList.add("t-settled"),1400);</script>
