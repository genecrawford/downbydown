<style>
/* Down x Down home: the teams section ("Start with your team"). Paste this whole file into one Divi Code module, in a section under the leaders section.
   The marker, heading and link are yours to edit here; the 32 teams by division are the plugin's teams block (2.5.0+). */
.et_pb_column:has(.dxd-tm){padding:0!important}
.et_pb_module:has(.dxd-tm){align-items:stretch!important}  /* Divi centers a module's content, which would shrink the section */
.et_pb_text_inner:has(.dxd-tm),.et_pb_code_inner:has(.dxd-tm){width:100%!important;max-width:none!important}
.dxd-tm{background:#f4f1ea;color:#121417;border-top:1px solid rgba(22,30,54,.22);font-family:"IBM Plex Sans",system-ui,sans-serif;-webkit-font-smoothing:auto;-moz-osx-font-smoothing:auto}  /* Divi's antialiased smoothing hollows Tourney */
.dxd-tm *{box-sizing:border-box}
.dxd-tm p:empty{display:none}
.dxd-tm .dxd-wrap{max-width:1240px;margin:0 auto;padding:clamp(40px,6vw,72px) clamp(16px,4vw,48px)}
.dxd-tm .dxd-sec-h{display:flex;flex-wrap:wrap;align-items:flex-end;gap:6px 20px;margin-bottom:22px}
/* the sideline down marker */
.dxd-tm .dxd-dm{display:flex;flex-basis:100%;align-items:center;gap:10px;margin-bottom:4px}
.dxd-tm .dxd-dm .b{display:flex;align-items:flex-start;justify-content:center;width:48px;height:48px;padding-top:4px;border-radius:7px;background:#cb2026;color:#fff}
.dxd-tm .dxd-dm .b b{font:800 32px/1 "Tourney",sans-serif}
.dxd-tm .dxd-dm .b sup{margin-top:2px;font:700 13px "Barlow Condensed",sans-serif;text-transform:uppercase;vertical-align:baseline;top:0}
.dxd-tm .dxd-dm .t b{display:block;font:700 26px/1 "Barlow Condensed",sans-serif;letter-spacing:.04em;text-transform:uppercase}
.dxd-tm .dxd-dm .t small{display:block;margin-top:3px;font:600 11px "IBM Plex Mono",monospace;letter-spacing:.08em;text-transform:uppercase;color:#5d616a}
.dxd-tm h2{margin:0;padding:0;color:#121417;font:800 clamp(30px,3.6vw,48px)/1.02 "Tourney",sans-serif;text-transform:uppercase}
.dxd-tm .dxd-more{margin-left:auto;color:#121417;font:700 14px "Barlow Condensed",sans-serif;letter-spacing:.12em;text-transform:uppercase;text-decoration:underline;text-underline-offset:4px;white-space:nowrap}
.dxd-tm .dxd-more:hover{color:#cb2026}
@media (max-width:700px){.dxd-tm .dxd-more{margin-left:0}}
</style>
<section class="dxd-tm">
<div class="dxd-wrap">
<div class="dxd-sec-h">
<span class="dxd-dm" aria-hidden="true"><span class="b"><b>2</b><sup>nd</sup></span><span class="t"><b>&amp; 3</b><small>Opp 31</small></span></span>
<h2>Start with your team</h2>
<a class="dxd-more" href="https://downbydown.com/teams/">Open the play explorer</a>
</div>
[dbd_block type="teams"]
</div>
</section>
