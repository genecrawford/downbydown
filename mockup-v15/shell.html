<!doctype html><html class="no-js"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>%TITLE%</title>
<link href="https://fonts.googleapis.com/css2?family=Tourney:wght@800&family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/dbd.css"><link rel="stylesheet" href="assets/transitions.css"><link rel="stylesheet" href="assets/m15.css">
</head><body class="dbd-app">
<div class="mk-bar"><b>Mock · the week in review</b><span>A new page, <code>?view=week&amp;week=N</code>, built from the site's own published data in the live 1.15.2 shell. Every number is real. <a href="week-7.html">Week 7</a> is a finished week; <a href="week-8.html">Week 8</a> has games still to play.</span><label><input type="checkbox" id="mk-toggle" checked> Show outlines</label></div>
<div class="entry-content">%ROOT%</div>
<script src="assets/dbd-site.js"></script><script src="assets/marks.js"></script>
<script>
document.getElementById('mk-toggle').addEventListener('change',function(e){document.body.classList.toggle('mk-off',!e.target.checked);});
/* ships as assets/week.js: the scoreboard's Kickoff order / Most dramatic switch */
document.querySelectorAll('.wk-games').forEach(function(p){var seg=p.querySelector('.wk-sort'),grid=p.querySelector('.wk-grid');if(!seg||!grid)return;var pl=seg.querySelector('.t-tabs-pill');
var go=function(){var t=seg.querySelector('[aria-selected=true]');if(t&&t.offsetWidth){pl.style.transform='translateX('+t.offsetLeft+'px)';pl.style.width=t.offsetWidth+'px';}};
seg.addEventListener('click',function(e){var b=e.target.closest('.t-tab');if(!b)return;seg.querySelectorAll('.t-tab').forEach(function(x){x.setAttribute('aria-selected',x===b?'true':'false');});go();
var k=b.dataset.sort,cards=[].slice.call(grid.children);cards.sort(function(a,c){return k==='d'?(+c.dataset.d)-(+a.dataset.d):(a.dataset.k<c.dataset.k?-1:a.dataset.k>c.dataset.k?1:0);});cards.forEach(function(c){grid.appendChild(c);});});
setTimeout(go,200);window.addEventListener('load',go);});
</script>
</body></html>
