# Build check: run the real nightly data build against this season's nflverse files whenever the build script
# changes, into a copy of the repo's data (so the career caches are reused and nothing is committed).
name: Build check
on:
  pull_request:
    paths:
      - 'tools/build_data.py'
      - 'tools/view_harness.php'
      - 'plugin/down-by-down/includes/views/player.php'
      - 'plugin/down-by-down/includes/views/game.php'
      - 'plugin/down-by-down/includes/views/teamplayers.php'
      - 'plugin/down-by-down/includes/class-dbd-lineup.php'
      - 'plugin/down-by-down/includes/class-dbd-fantasy.php'
      - 'plugin/down-by-down/includes/class-dbd-myteam.php'
      - 'plugin/down-by-down/includes/views/myteam.php'
      - 'plugin/down-by-down/includes/class-dbd-leaders.php'
      - 'plugin/down-by-down/includes/views/leaders.php'
      - 'plugin/down-by-down/includes/views/players.php'
      - 'plugin/down-by-down/includes/views/matchups.php'
      - 'plugin/down-by-down/includes/views/compare.php'
      - '.github/workflows/build-data.yml'
      - '.github/workflows/build-check.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pandas
        run: pip install pandas pillow
      - name: Download nflverse files
        run: |
          set -e
          Y=$(date -u +%Y); M=$(date -u +%-m); if [ "$M" -lt 3 ]; then Y=$((Y-1)); fi; S=$Y
          mkdir -p in
          curl -sSL -o in/roster.csv "https://github.com/nflverse/nflverse-data/releases/download/rosters/roster_${S}.csv"
          curl -sSL -o in/teams.csv  "https://github.com/nflverse/nflverse-data/releases/download/teams/teams_colors_logos.csv"
          curl -sSL -o in/games.csv  "https://raw.githubusercontent.com/nflverse/nfldata/master/data/games.csv"
          if curl -sSL -f -o in/pbp.csv.gz "https://github.com/nflverse/nflverse-data/releases/download/pbp/play_by_play_${S}.csv.gz"; then echo "pbp=in/pbp.csv.gz" >> "$GITHUB_ENV"; else echo "pbp=-" >> "$GITHUB_ENV"; fi
          dl() { if curl -sSL -f -o "in/$2" "https://github.com/nflverse/nflverse-data/releases/download/$1"; then echo "$3=in/$2" >> "$GITHUB_ENV"; fi; }
          dl "stats_player/stats_player_week_${S}.csv"  stats.csv   DBD_STATS
          dl "snap_counts/snap_counts_${S}.csv"         snaps.csv   DBD_SNAPS
          dl "pfr_advstats/advstats_week_rec_${S}.csv"  pfr.csv     DBD_PFR
          dl "injuries/injuries_${S}.csv"               inj.csv     DBD_INJ
          dl "depth_charts/depth_charts_${S}.csv"       depth.csv   DBD_DEPTH
          dl "ftn_charting/ftn_charting_${S}.csv"       ftn.csv     DBD_FTN
      - name: Run the build into a copy of the data
        run: |
          set -e
          cp -r data /tmp/out
          python3 tools/build_data.py "$pbp" in/roster.csv in/games.csv in/teams.csv /tmp/out
          python3 -c "import json;t=json.load(open('/tmp/out/teams.json'));print(len(t),'teams;',sum(1 for v in t.values() if v.get('logo')),'with logos;',sum(1 for v in t.values() if v.get('logo_s')),'with a logo scale');print(' '.join(k+'='+str(v.get('logo_s')) for k,v in sorted(t.items())))"
          ls /tmp/out/players | head -40 | tr '\n' ' '
      - name: Check the EPA split (SCOPE §29)
        run: |
          python3 - <<'PY'
          import json, glob, os, sys
          bad = []; worst = (0, None); n = 0
          for f in glob.glob('/tmp/out/players/[A-Z]*.json'):  # team files only (index, league, movers and leaders sit beside them)
              if os.path.basename(f) in ('index.json', 'league.json', 'movers.json'): continue
              for p in json.load(open(f))['players']:
                  ep = p.get('ep')
                  if not ep or not (p.get('grades') or {}).get('q'): continue
                  n += 1
                  for k, tot, oth, parts in ep['sec']:
                      s = sum(x[1] for x in parts) + oth
                      if abs(s - tot) > 0.01: bad.append(f"{p['name']} {k}: parts {s:.3f} vs total {tot:.3f}")
                      if abs(oth) > worst[0]: worst = (abs(oth), f"{p['name']} {k} {oth:+.3f}")
                      if abs(oth) > 3: bad.append(f"{p['name']} {k}: other {oth:+.2f} is over 3 EPA")
                  if p['id'] in ('00-0034857', '00-0036322'):
                      print(p['name'], 'total', ep['tot'], 'rank', ep.get('rk', {}).get('tot'), 'ANY/A', ep.get('any'), ep.get('rk', {}).get('any'), [(s[0], s[1]) for s in ep['sec']], 'injw', p.get('injw'))
          lg = json.load(open('/tmp/out/players/league.json'))
          print(n, 'qualifiers checked; largest other', worst, '; league grid cells', {k: len(v) for k, v in lg.get('grid', {}).items()})
          if bad: print('\n'.join(bad)); sys.exit(1)
          PY
      - name: Check the win probability files (SCOPE §30)
        run: |
          python3 - <<'PY'
          import json, glob, sys
          bad = []; n = 0; ot = 0
          for f in sorted(glob.glob('/tmp/out/wp/w*.json')):
              for gid, g in json.load(open(f))['games'].items():
                  n += 1; s = g['s']; end = 500 if g['ot'] else g['fin']; ot += bool(g['ot'])
                  if s[0][1] != g['pre']: bad.append(f'{gid}: series does not start at the kickoff chance')
                  if g['fin'] not in (0, 500, 1000): bad.append(f'{gid}: result {g["fin"]}')
                  if any(x[0] > 3600 for x in s): bad.append(f'{gid}: an overtime point in the series')
                  sw = sorted(abs((s[i + 1][1] if i + 1 < len(s) else end) - s[i][1]) for i in range(len(s)))[-5:]
                  if sorted(abs(t[1]) for t in g['top']) != sw: bad.append(f'{gid}: top swings are not the five largest')
                  if gid in ('2026_04_LA_PHI', '2026_02_IND_KC', '2026_05_NYG_WAS'):
                      print(gid, 'pre', g['pre'], 'flips', g['flips'], 'lo', g['lo'] is not None and s[g['lo']], 'tp', g['tp'] and g['tp'][3][:60], 'ot scores', len(g['otsc']), 'biggest', g['top'][0][1])
          print(n, 'final games,', ot, 'went to overtime')
          sch = json.load(open('/tmp/out/schedule.json'))
          finals = {g['id'] for gl in sch['weeks'].values() for g in gl if g['status'] == 'final' and g.get('game_type', 'REG') == 'REG'}
          have = {gid for f in glob.glob('/tmp/out/wp/w*.json') for gid in json.load(open(f))['games']}
          if finals - have: bad.append('final games with no win probability: ' + ', '.join(sorted(finals - have)))
          if bad: print('\n'.join(bad)); sys.exit(1)
          PY
      - name: Check the lineups and box scores (SCOPE §32)
        run: |
          python3 - <<'PY'
          import json, glob, sys
          bad = []
          lu = json.load(open('/tmp/out/lineups.json'))['teams']
          for t, u in sorted(lu.items()):
              no, nd = len(u['off']), len(u['def'])
              if no != 11: bad.append(f'{t}: {no} offensive starters')
              if nd not in (11, 12): bad.append(f'{t}: {nd} defensive starters')
              if any(not e.get('name') for e in list(u['off'].values()) + list(u['def'].values())): bad.append(f'{t}: a starter with no name')
          print(len(lu), 'teams in lineups.json;', 'KC', sorted(lu.get('KC', {}).get('off', {})), lu.get('KC', {}).get('grp'))
          sch = json.load(open('/tmp/out/schedule.json'))
          finals = {g['id'] for gl in sch['weeks'].values() for g in gl if g['status'] == 'final' and g.get('game_type', 'REG') == 'REG'}
          have = {gid for f in glob.glob('/tmp/out/box/w*.json') for gid in json.load(open(f))['games']}
          if finals - have: bad.append('final games with no box score: ' + ', '.join(sorted(finals - have)))
          b = json.load(open('/tmp/out/box/w2.json')); g = b['games'].get('2026_02_IND_KC')
          if g: print('IND at KC box:', len(g['away']['off']), 'and', len(g['home']['off']), 'offensive lines; defense', g['away']['d'][:2], 'kicking', g['away']['k'])
          print(len(have), 'box scores')
          if lu and len(lu) != 32: bad.append(f'{len(lu)} teams in lineups.json')
          if bad: print('\n'.join(bad)); sys.exit(1)
          PY
      - name: Check the series and records (SCOPE §33)
        run: |
          python3 - <<'PY'
          import json, sys
          d = json.load(open('/tmp/out/series.json')); bad = []
          sch = json.load(open('/tmp/out/schedule.json'))
          pairs = {'-'.join(sorted((g['away'], g['home']))) for gl in sch['weeks'].values() for g in gl}
          if pairs - set(d['pairs']): bad.append('pairs with no series: ' + ', '.join(sorted(pairs - set(d['pairs']))[:10]))
          for t, r in d['records'].items():
              if sum(r['rec'].get('all', [0, 0, 0])) != r['g']: bad.append(f'{t}: record does not add up to games played')
              if sum(r['rec'].get('home', [0, 0, 0])) + sum(r['rec'].get('away', [0, 0, 0])) != r['g']: bad.append(f'{t}: home and away do not add up')
          s = d['pairs'].get('DET-MIN')
          if s: print('DET-MIN from DET side:', s['w'], '-', s['l'], 'home', s['home'], 'road', s['road'], 'streak', s['streak'], 'last', s['lastm']['date'], s['lastm']['qb'])
          print('MIN record', d['records']['MIN']['rec'], d['records']['MIN']['streak'], '; DET', d['records']['DET']['rec'].get('all'))
          print(len(d['pairs']), 'pairs since', d['first'])
          if bad: print('\n'.join(bad)); sys.exit(1)
          PY
      - name: Check the fantasy numbers (SCOPE §34)
        run: |
          python3 - <<'PY'
          import json, glob, sys
          f = json.load(open('/tmp/out/fantasy.json')); bad = []
          if len(f['allow']) != 32: bad.append(f"{len(f['allow'])} defenses in fantasy.json, not 32")
          for d, ps in f['allow'].items():
              for pos in ('QB', 'RB', 'WR', 'TE'):
                  v = ps.get(pos)
                  if not v or len(v) != 3: bad.append(f'{d} {pos}: missing points allowed'); continue
                  if not (v[0] - .01 <= v[1] <= v[2] + .01): bad.append(f'{d} {pos}: half PPR {v[1]} not between {v[0]} and {v[2]}')
          n = 0
          for fn in glob.glob('/tmp/out/players/[A-Z]*.json'):
              for p in json.load(open(fn))['players']:
                  fan = p.get('fan')
                  if not fan: continue
                  n += 1
                  if set(fan['s']) != {'std', 'half', 'ppr'}: bad.append(f"{p['name']}: formats {sorted(fan['s'])}")
                  s_ = fan['s']
                  if not (s_['std']['ppg'] - .01 <= s_['half']['ppg'] <= s_['ppr']['ppg'] + .01): bad.append(f"{p['name']}: half PPR out of order")
                  for w in p['weeks']:
                      if 'fantasy_points' not in w or 'fantasy_points_ppr' not in w: bad.append(f"{p['name']} week {w.get('week')}: no fantasy points"); break
          idx = json.load(open('/tmp/out/players/index.json'))['players']
          withfp = [r for r in idx if r.get('fp')]
          for r in withfp:
              if not (r['fp'][0] - .01 <= r['fp'][1] <= r['fp'][2] + .01): bad.append(f"index {r['name']}: fp out of order")
          top = lambda pos: sorted((r for r in withfp if r.get('fpos') == pos and r['fr'][1]), key=lambda r: r['fr'][1])[:3]
          for pos in ('QB', 'RB', 'WR', 'TE'): print(pos, 'half PPR leaders:', ', '.join(f"{r['name']} {r['fp'][1]:.1f}" for r in top(pos)))
          j = next((r for r in withfp if r['id'] == '00-0036322'), None)
          if j: print('Jefferson', j['fp'], j['fr'])
          print('DET allows WRs', f['allow']['DET']['WR'], 'rank', f['rank']['DET']['WR'], '; starter lines', f['start'])
          print(n, 'player files with a fantasy block;', len(withfp), 'index rows with points')
          if n < 300: bad.append(f'only {n} players have a fantasy block')
          if bad: print('\n'.join(bad[:40])); sys.exit(1)
          PY
      - name: Check the leaders file (SCOPE §37)
        run: |
          python3 - <<'PY'
          import json, sys
          L = json.load(open('/tmp/out/players/leaders.json')); bad = []
          want = {'rec': ['tshare', 'adot', 'yacpc', 'catch', 'epat', 'fdpt', 'drop', 'ypg'], 'rb': ['ypc', 'repc', 'btpt', 'expl', 'tpg', 'tgtshare', 'ypt'], 'qb': ['epadb', 'cpoe', 'sack', 'ypa', 'tdr', 'intr', 'adot', 'rushepa']}
          for g, ks in want.items():
              for k in ks:
                  rows = L['groups'][g]['g'].get(k) or []
                  if not any(r[3] for r in rows): bad.append(f'{g}.{k}: no qualified rows')
                  if any(r[0] not in L['players'] for r in rows): bad.append(f'{g}.{k}: a row with no player entry')
              if not L['groups'][g]['fp']: bad.append(f'{g}: no Playstyle boards')
          idx = {r['id']: r for r in json.load(open('/tmp/out/players/index.json'))['players']}
          for pos in ('QB', 'RB', 'WR', 'TE'):
              top = L['fan']['half'].get('ppg.' + pos) or []
              if not top: bad.append(f'fan ppg.{pos}: empty'); continue
              t = top[0]; print(pos, 'half-PPR leader:', L['players'][t[0]][0], t[1])
              if idx.get(t[0], {}).get('fr', [0, 0, 0])[1] != 1: bad.append(f'fan ppg.{pos}: leader is not rank 1 in the index')
          rec = sorted((r for r in L['groups']['rec']['g']['tshare'] if r[3]), key=lambda r: -r[1])[0]; print('target share leader:', L['players'][rec[0]][0], rec[1])
          print(len(L['players']), 'players in leaders.json')
          if bad: print('\n'.join(bad)); sys.exit(1)
          PY
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Render pages from the fresh data (a QB, a receiver, a back, a non-qualifier; a regulation game, an overtime game, a tie)
        run: |
          set -e
          export DBD_HARNESS_HTML=pages
          for id in 00-0034857 00-0036322 00-0033293 00-0036259; do php tools/view_harness.php /tmp/out player $id; done
          for gm in 2026_04_LA_PHI 2026_02_IND_KC 2026_05_NYG_WAS; do php tools/view_harness.php /tmp/out game $gm; grep -q 'class="dbd-panel dbd-wp"' "pages/game-$gm.html" || { echo "no win probability panel on $gm"; exit 1; }; done
          php tools/view_harness.php /tmp/out game 2026_02_IND_KC && grep -q 'class="dbd-panel dbd-box"' pages/game-2026_02_IND_KC.html || { echo "no box score on IND at KC"; exit 1; }
          UP=$(python3 -c "import json;s=json.load(open('/tmp/out/schedule.json'));print(next((g['id'] for w in sorted(s['weeks'],key=int) for g in s['weeks'][w] if g['status']!='final'),''))")
          if [ -n "$UP" ]; then php tools/view_harness.php /tmp/out game $UP && grep -q 'class="dbd-panel dbd-lu"' "pages/game-$UP.html" || { echo "no lineups on $UP"; exit 1; }; fi
          php tools/view_harness.php /tmp/out teamplayers MIN && grep -q 'dbd-lufield unit' pages/teamplayers-MIN.html || { echo "no lineup on the Vikings page"; exit 1; }
          php tools/view_harness.php /tmp/out game 2026_08_MIN_DET && grep -q 'class="dbd-panel dbd-series"' pages/game-2026_08_MIN_DET.html || { echo "no series on Vikings at Lions"; exit 1; }
          grep -q 'dbd-recline' pages/teamplayers-MIN.html || { echo "no record line on the Vikings page"; exit 1; }
          grep -q 'class="dbd-panel dbd-fx"' pages/player-00-0036322.html || { echo "no fantasy panel on Jefferson"; exit 1; }
          php tools/view_harness.php /tmp/out players "" && grep -q 'dbd-pfp" data-fv=' pages/players.html || { echo "no fantasy column on the Players index"; exit 1; }
          php tools/view_harness.php /tmp/out matchups ""
          if [ -n "$UP" ]; then grep -q 'class="dbd-panel dbd-fxm"' pages/matchups.html || { echo "no fantasy matchups on the Matchups page"; exit 1; }; fi
          CMP=$(python3 -c "import json;i=json.load(open('/tmp/out/players/index.json'))['players'];w=[r['id'] for r in sorted((r for r in i if r.get('fpos')=='WR' and r.get('fr') and r['fr'][1]),key=lambda r:r['fr'][1])[:2]];print(','.join(w))")
          php tools/view_harness.php /tmp/out compare "$CMP" && grep -q 'class="dbd-panel dbd-fx dbd-cfx"' "pages/compare-$CMP.html" || { echo "no fantasy panel on compare $CMP"; exit 1; }
          php tools/view_harness.php /tmp/out myteam "" && grep -q 'class="mt-sample"' pages/myteam.html || { echo "no sample link on the empty My team page"; exit 1; }
          MT=$(python3 -c "import re,urllib.parse as u;s=open('pages/myteam.html').read();v=re.search(r'myteam=([^\"&]+)\" class=\"mt-sample\"',s).group(1);print(u.unquote(u.unquote(v)))")
          echo "sample team: $MT"
          php tools/view_harness.php /tmp/out myteam "$MT" && python3 -c "import sys;s=open('pages/myteam-$MT.html').read();n=s.count('class=\"mt-row')-s.count('class=\"mt-row empty');print(n,'filled rows');sys.exit(0 if n>=36 else 1)" || { echo "the sample team did not fill the lineup and bench in all three formats"; exit 1; }
          grep -q 'class="dbd-mtbtn"' pages/player-00-0036322.html || { echo "no My team button on Jefferson"; exit 1; }
          php tools/view_harness.php /tmp/out leaders "" && [ "$(grep -o 'class="dbd-panel ld-card"' pages/leaders.html | wc -l)" -eq 7 ] || { echo "the fantasy tab does not have seven boards"; exit 1; }
          php tools/view_harness.php /tmp/out leaders rec && [ "$(grep -o 'class="dbd-panel ld-card"' pages/leaders-rec.html | wc -l)" -eq 16 ] || { echo "the receivers tab does not have sixteen boards"; exit 1; }
          php tools/view_harness.php /tmp/out leaders qb && grep -q 'ld-card' pages/leaders-qb.html || { echo "no quarterback boards"; exit 1; }
          php tools/view_harness.php /tmp/out leaders rec.g.drop && grep -q 'data-low="1"' pages/leaders-rec.g.drop.html || { echo "the drop rate board is not marked lower-is-better"; exit 1; }
          php tools/view_harness.php /tmp/out leaders fan.ppg.WR && grep -q 'ld-full' pages/leaders-fan.ppg.WR.html || { echo "no full WR fantasy board"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: pages-fresh-data
          path: pages/
