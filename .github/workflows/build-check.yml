# Build check: run the real nightly data build against this season's nflverse files whenever the build script
# changes, into a copy of the repo's data (so the career caches are reused and nothing is committed).
name: Build check
on:
  pull_request:
    paths:
      - 'tools/build_data.py'
      - 'tools/view_harness.php'
      - 'plugin/down-by-down/includes/views/player.php'
      - '.github/workflows/build-data.yml'
      - '.github/workflows/build-check.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pandas
        run: pip install pandas pillow
      - name: Download nflverse files
        run: |
          set -e
          Y=$(date -u +%Y); M=$(date -u +%-m); if [ "$M" -lt 3 ]; then Y=$((Y-1)); fi; S=$Y
          mkdir -p in
          curl -sSL -o in/roster.csv "https://github.com/nflverse/nflverse-data/releases/download/rosters/roster_${S}.csv"
          curl -sSL -o in/teams.csv  "https://github.com/nflverse/nflverse-data/releases/download/teams/teams_colors_logos.csv"
          curl -sSL -o in/games.csv  "https://raw.githubusercontent.com/nflverse/nfldata/master/data/games.csv"
          if curl -sSL -f -o in/pbp.csv.gz "https://github.com/nflverse/nflverse-data/releases/download/pbp/play_by_play_${S}.csv.gz"; then echo "pbp=in/pbp.csv.gz" >> "$GITHUB_ENV"; else echo "pbp=-" >> "$GITHUB_ENV"; fi
          dl() { if curl -sSL -f -o "in/$2" "https://github.com/nflverse/nflverse-data/releases/download/$1"; then echo "$3=in/$2" >> "$GITHUB_ENV"; fi; }
          dl "stats_player/stats_player_week_${S}.csv"  stats.csv   DBD_STATS
          dl "snap_counts/snap_counts_${S}.csv"         snaps.csv   DBD_SNAPS
          dl "pfr_advstats/advstats_week_rec_${S}.csv"  pfr.csv     DBD_PFR
          dl "injuries/injuries_${S}.csv"               inj.csv     DBD_INJ
          dl "depth_charts/depth_charts_${S}.csv"       depth.csv   DBD_DEPTH
          dl "ftn_charting/ftn_charting_${S}.csv"       ftn.csv     DBD_FTN
      - name: Run the build into a copy of the data
        run: |
          set -e
          cp -r data /tmp/out
          python3 tools/build_data.py "$pbp" in/roster.csv in/games.csv in/teams.csv /tmp/out
          python3 -c "import json;t=json.load(open('/tmp/out/teams.json'));print(len(t),'teams;',sum(1 for v in t.values() if v.get('logo')),'with logos;',sum(1 for v in t.values() if v.get('logo_s')),'with a logo scale');print(' '.join(k+'='+str(v.get('logo_s')) for k,v in sorted(t.items())))"
          ls /tmp/out/players | head -40 | tr '\n' ' '
      - name: Check the EPA split (SCOPE §29)
        run: |
          python3 - <<'PY'
          import json, glob, os, sys
          bad = []; worst = (0, None); n = 0
          for f in glob.glob('/tmp/out/players/*.json'):
              if os.path.basename(f) in ('index.json', 'league.json', 'movers.json'): continue
              for p in json.load(open(f))['players']:
                  ep = p.get('ep')
                  if not ep or not (p.get('grades') or {}).get('q'): continue
                  n += 1
                  for k, tot, oth, parts in ep['sec']:
                      s = sum(x[1] for x in parts) + oth
                      if abs(s - tot) > 0.01: bad.append(f"{p['name']} {k}: parts {s:.3f} vs total {tot:.3f}")
                      if abs(oth) > worst[0]: worst = (abs(oth), f"{p['name']} {k} {oth:+.3f}")
                      if abs(oth) > 3: bad.append(f"{p['name']} {k}: other {oth:+.2f} is over 3 EPA")
                  if p['id'] in ('00-0034857', '00-0036322'):
                      print(p['name'], 'total', ep['tot'], 'rank', ep.get('rk', {}).get('tot'), 'ANY/A', ep.get('any'), ep.get('rk', {}).get('any'), [(s[0], s[1]) for s in ep['sec']], 'injw', p.get('injw'))
          lg = json.load(open('/tmp/out/players/league.json'))
          print(n, 'qualifiers checked; largest other', worst, '; league grid cells', {k: len(v) for k, v in lg.get('grid', {}).items()})
          if bad: print('\n'.join(bad)); sys.exit(1)
          PY
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Render player pages from the fresh data (a QB, a receiver, a back, a non-qualifier)
        run: |
          set -e
          export DBD_HARNESS_HTML=pages
          for id in 00-0034857 00-0036322 00-0033293 00-0036259; do php tools/view_harness.php /tmp/out player $id; done
      - uses: actions/upload-artifact@v4
        with:
          name: pages-fresh-data
          path: pages/
