name: Build data

# Three times a day during the season (06:15, 10:15 and 14:15 UTC), plus extra runs around the games, plus a manual
# trigger. GitHub often starts scheduled runs hours late and sometimes drops them (on Nov 3 2026 the overnight run never
# came, so Monday night's game sat unfinished until a manual run), and nflverse posts weekly player stats a few hours
# after the play-by-play. The extra runs are backstops: Sunday after the early and late games (21:37 and 01:37 UTC
# Monday), after Sunday night (05:37 UTC Monday), and after Monday night (05:37 and 08:37 UTC Tuesday). Off the top of
# the hour, when GitHub is busiest. A run with nothing new commits nothing; overlapping runs queue (concurrency below).
# Each run downloads the nflverse files, rebuilds /data, commits it if anything changed, then tells the WordPress site to sync. The site also pulls daily on its own as a fallback.
on:
  schedule:
    - cron: "15 6,10,14 * 9-12 *"
    - cron: "15 6,10,14 * 1-2 *"
    - cron: "37 21 * 9-12 0"         # Sunday 21:37 UTC: the early games
    - cron: "37 21 * 1-2 0"
    - cron: "37 1,5 * 9-12 1"        # Monday 01:37 and 05:37 UTC: Sunday's late games, then Sunday night
    - cron: "37 1,5 * 1-2 1"
    - cron: "37 5,8 * 9-12 2"        # Tuesday 05:37 and 08:37 UTC: Monday night
    - cron: "37 5,8 * 1-2 2"
  workflow_dispatch:
    inputs:
      week:
        description: "Force a week number (leave blank to derive from the schedule)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: build-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pandas
        run: pip install --quiet pandas pillow

      - name: Work out the season
        id: season
        run: |
          # The NFL season is named for the year it starts; before March we are still in last year's season.
          Y=$(date -u +%Y); M=$(date -u +%-m)
          if [ "$M" -lt 3 ]; then Y=$((Y-1)); fi
          echo "season=$Y" >> "$GITHUB_OUTPUT"

      - name: Download nflverse files
        env:
          S: ${{ steps.season.outputs.season }}
        run: |
          mkdir -p in
          curl -sSL -o in/roster.csv "https://github.com/nflverse/nflverse-data/releases/download/rosters/roster_${S}.csv"
          curl -sSL -o in/teams.csv  "https://github.com/nflverse/nflverse-data/releases/download/teams/teams_colors_logos.csv"
          curl -sSL -o in/games.csv  "https://raw.githubusercontent.com/nflverse/nfldata/master/data/games.csv"
          # Play-by-play does not exist until the season starts; a 404 here is normal in August.
          if curl -sSL -f -o in/pbp.csv.gz "https://github.com/nflverse/nflverse-data/releases/download/pbp/play_by_play_${S}.csv.gz"; then
            echo "pbp=in/pbp.csv.gz" >> "$GITHUB_ENV"
          else
            echo "No play-by-play for ${S} yet; building schedule-only data."
            echo "pbp=-" >> "$GITHUB_ENV"
          fi
          # Player layer inputs. Each is optional: a 404 just leaves that part of the player pages empty.
          dl() { if curl -sSL -f -o "in/$2" "https://github.com/nflverse/nflverse-data/releases/download/$1"; then echo "$3=in/$2" >> "$GITHUB_ENV"; else echo "No $2 for ${S}; skipping."; fi; }
          dl "stats_player/stats_player_week_${S}.csv"  stats.csv   DBD_STATS
          dl "snap_counts/snap_counts_${S}.csv"         snaps.csv   DBD_SNAPS
          dl "pfr_advstats/advstats_week_rec_${S}.csv"  pfr.csv     DBD_PFR
          dl "pfr_advstats/advstats_week_def_${S}.csv"  pfrd.csv    DBD_PFRD
          dl "injuries/injuries_${S}.csv"               inj.csv     DBD_INJ
          dl "depth_charts/depth_charts_${S}.csv"       depth.csv   DBD_DEPTH
          dl "ftn_charting/ftn_charting_${S}.csv"       ftn.csv     DBD_FTN
          ls -la in

      - name: Set last season aside (SCOPE §44)
        env:
          S: ${{ steps.season.outputs.season }}
        run: |
          # the first build of a new season moves the finished one, playoffs and all, to data/archive/{season}/
          python3 tools/archive.py freeze data "$S"

      - name: Build data
        run: |
          mkdir -p data
          python3 tools/build_data.py "$pbp" in/roster.csv in/games.csv in/teams.csv data ${{ github.event.inputs.week }}

      - name: Commit data if it changed
        id: commit
        run: |
          git config user.name "downbydown-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No data changes."
          else
            git commit -m "data: nightly build $(date -u +%Y-%m-%d)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Tell the site to sync
        if: steps.commit.outputs.changed == 'true' && vars.DBD_SITE_URL != ''
        env:
          SITE: ${{ vars.DBD_SITE_URL }}
          TOKEN: ${{ secrets.DBD_SYNC_TOKEN }}
        run: |
          # The plugin's endpoint fetches the new manifest from this repo and downloads what changed.
          # ?rest_route= works whether or not the site uses pretty permalinks. Print only the JSON line and the status.
          curl -sS -X POST "${SITE%/}/?rest_route=/dbd/v1/sync" -H "X-DBD-Token: ${TOKEN}" -H "Accept: application/json" -o /tmp/sync.json -w "HTTP %{http_code}\n" || echo "Sync call failed; the site will pull on its own schedule."
          head -c 600 /tmp/sync.json; echo
