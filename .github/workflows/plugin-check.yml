# Plugin check: PHP syntax across the plugin and tools, and a real render of three share cards with GD.
# Runs on every pull request and by hand. The cards upload as an artifact so a reviewer can look at them.
name: Plugin check
on:
  pull_request:
  workflow_dispatch:
jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: gd
          coverage: none
      - name: Syntax check every PHP file
        run: |
          set -e
          find plugin tools -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: The season draft and combine boards (SCOPE §63)
        run: |
          set -e
          export DBD_HARNESS_HTML=pages
          php tools/view_harness.php data draft 2026
          f=pages/draft-2026.html
          [ "$(grep -o '<tr data-p=' $f | wc -l)" -eq 257 ] || { echo "the 2026 board should have 257 picks"; exit 1; }
          grep -qF 'The <em>2026</em> draft' $f && grep -qF 'data-filter="pos"' $f && grep -qF 'Early returns' $f || { echo "the 2026 draft board is missing a piece"; exit 1; }
          grep -qF '>2026 combine results</a>' $f && grep -qF 'class="bd-next"' $f && grep -qF 'The 2026 combine' $f || { echo "the draft board lost its links to the combine (2.23.1)"; exit 1; }
          grep -qF 'Round 1 <span>32 picks</span>' $f && grep -qF '<span class="ps"><b>' $f && ! grep -qF '<th data-k="pos">' $f || { echo "the pick list cleanup is missing (2.23.2)"; exit 1; }
          # SCOPE §64: the board's title leads with the search, its share card and its ItemList
          grep -qF '<title>2026 NFL Draft results: every pick by round | Down by Down</title>' $f || { echo "the draft board's title is not the search title"; exit 1; }
          grep -qF 'card=page-draft-2026' $f || { echo "the draft board has no share card"; exit 1; }
          python3 tools/check_ld.py $f ItemList 'Fernando Mendoza' || exit 1
          php tools/view_harness.php data draft 1983
          f=pages/draft-1983.html
          python3 -c "import sys,re; h=open('$f').read(); r=re.search(r'<tr data-p=\"1\"[^>]*>.*?</tr>', h, re.S).group(0); sys.exit(0 if 'John Elway' in r and '>BAL<' in r and 'bd-hof' in r and 'The combine data starts in 2000' in h and 'Class leaders' in h else 'the 1983 board is wrong: Elway should be the Baltimore pick, HOF')"
          php tools/view_harness.php data combine 2026
          f=pages/combine-2026.html
          grep -qF 'card=page-combine-2026' $f && grep -qF '<title>2026 NFL Combine results: 40 times and every drill | Down by Down</title>' $f || { echo "the combine board lost its share card or title"; exit 1; }
          python3 tools/check_ld.py $f ItemList 'Brenen Thompson' || exit 1
          [ "$(grep -o 'class="dbd-panel bd-lead"' $f | wc -l)" -eq 6 ] || { echo "the combine board should have six leader lists"; exit 1; }
          grep -qF '>2026 draft board</a>' $f && grep -qF 'class="bd-next"' $f || { echo "the combine board lost its links to the draft (2.23.1)"; exit 1; }
          grep -qF 'Brenen Thompson' $f && grep -qF 'LAC · R4 #105' $f || { echo "the combine board lost the fastest 40 or its draft slot"; exit 1; }
          grep -qF '>4.43<' pages/combine-2026.html || grep -qF '>4.26<' $f || { echo "combine times lost their hundredths"; exit 1; }
          python3 -c "import json,sys; m=json.load(open('data/manifest.json'))['files']; sys.exit(0 if 'draft/2026.json' in m and 'combine/2026.json' in m and 'boards.json' in m else 'the manifest does not list the board files, so sites would never download them')"
          # the Related panel on a kicker's page, and an archived-season board keeps this season's player links (Greptile, PR #117)
          K=$(python3 -c "import json; print(next(iter(json.load(open('data/players/kickers.json'))['kickers'])))")
          php tools/view_harness.php data player "$K" > /dev/null
          f=$(ls -t pages/player-*.html | head -1)
          grep -qF 'class="dbd-panel dbd-related"' $f && grep -qF '>Kickers leaders</a>' $f || { echo "the kicker page lost its Related panel"; exit 1; }
          if [ -d data/archive/2025 ]; then
            php tools/view_harness.php data path 2025/draft/2026/ | grep -q 'route draft' || { echo "/2025/draft/2026/ should route"; exit 1; }
            f=$(ls -t pages/*.html | head -1)
            python3 -c "import json,re,sys; b=[json.loads(x) for x in re.findall(r'<script type=.application/ld.json.>(.*?)</script>', open('$f').read(), re.S)]; u=[i['item'].get('url','') for x in b if x.get('@type')=='ItemList' for i in x['itemListElement']]; sys.exit(0 if u and not any('2025' in x for x in u) else 'the archived board links players into 2025 or has no list')"
          fi
          php tools/view_harness.php data draft 1970 | grep -q 'route notfound' || { echo "a year with no draft should be not found"; exit 1; }
          php tools/view_harness.php data path draft/ | grep -q 'route draft' || { echo "/draft/ should open the newest draft"; exit 1; }
          php tools/view_harness.php data path combine/2026/ | grep -q 'route combine' || { echo "/combine/2026/ should route"; exit 1; }

      - name: Render the views with a WordPress shim
        run: |
          set -e
          php tools/view_harness.php data player 00-0036322
          php tools/view_harness.php data player 00-0033293
          php tools/view_harness.php data player 00-0035228
          php tools/view_harness.php data player 00-0036259
          php tools/view_harness.php data player 00-0034857
          php tools/view_harness.php data players
          php tools/view_harness.php data team MIN
          php tools/view_harness.php data game 2026_04_LA_PHI
          php tools/view_harness.php data game 2026_08_KC_DEN
          php tools/view_harness.php data game 2026_08_MIN_DET
          php tools/view_harness.php data teamplayers MIN
          php tools/view_harness.php data hub
          php tools/view_harness.php data matchups
          php tools/view_harness.php data compare 00-0036322,00-0039075
          php tools/view_harness.php data myteam
          php tools/view_harness.php data leaders
          php tools/view_harness.php data leaders wr
          php tools/view_harness.php data defense MIN
          php tools/view_harness.php data leaders def
          php tools/view_harness.php data leaders te.g.tshare
          php tools/view_harness.php data week
          php tools/view_harness.php data week 7
          php tools/view_harness.php data leaders rec.g.tshare
          php tools/view_harness.php data myteam 00-0034857,00-0039139,00-0038542,00-0036322,00-0039075,00-0037744,00-0036358,00-0037838
      - name: Team news (SCOPE §49)
        run: |
          set -e
          # the matching step on made-up feeds (tools/fixtures/news), no network, with the clock pinned
          export DBD_HARNESS_NOW=1793728800 DBD_HARNESS_NEWS=/tmp/news.json
          php tools/view_harness.php data news tools/fixtures/news > /tmp/news-out.json
          python3 - <<'PY'
          import json
          from collections import Counter
          d = json.load(open('/tmp/news.json')); o = json.load(open('/tmp/news-out.json'))
          def need(c, m):
              if not c: raise SystemExit('team news: ' + m)
          M = d['MIN']; T = [x['h'] for x in M['t']]; L = [x['h'] for x in M['l']]
          need(len(T) == 8, f'the Vikings team column has {len(T)} stories, want 8: {T}')
          need('A newer Norseman story the stale copy lacks' in T, 'a stale feed copy took away a newer stored story (2.9.1)')
          need('A Vikings.com story from eight days ago' not in T, 'a stored story older than 7 days was kept')
          need('older copy' in o['status']['fan:MIN']['err'], 'a feed that sent an older copy of itself is not flagged')
          need('A Story From Two Weeks Ago' not in T, 'a story older than 7 days was kept')
          need('NFL Week 9 Power Rankings: You decide' not in T, 'an Athletic team-feed story naming no Viking was kept')
          need('Justin Jefferson and the new shape of the offense' in T, 'an Athletic story naming a Vikings player was dropped')
          top = M['t'][:5]; c = Counter(x['s'] for x in top)
          need(max(c.values()) <= 2, f'more than two from one source in the first five: {c}')
          need([x['ts'] for x in top] == sorted((x['ts'] for x in top), reverse=True), 'the first five are not newest first')
          jj = next(x for x in M['t'] if x['h'].startswith('Justin Jefferson by'))
          need(jj['w'] and jj['w'][0][0] == '00-0036322', 'the player a headline names is not linked')
          need(all((x['x'] == 1) == (x['s'] == 'The Athletic') for x in M['t'] + M['l']), 'the Subscriber marks are wrong')
          need(L == ['Vikings plan to start the backup in Week 9', 'Lions linebacker hurt in the win over the Vikings'], f'the Vikings league column is {L}')
          need(all('Nittany' not in x['h'] for t in d for x in d[t]['l']), 'a college story matched an NFL team')
          need(all('grades' not in x['h'] for t in d for x in d[t]['l']), 'a story naming four teams matched')
          DT = [x['h'] for x in d['DET']['t']]
          need('Pride Of Detroit film study from yesterday' in DT and 'Pride Of Detroit story from ten days ago' not in DT, f'a failed feed did not carry over just its recent stories: {DT}')
          need(len(d['DET']['t']) == 7 and sum(x['s'] == 'Detroitlions.com' for x in d['DET']['t'][:5]) == 4, 'with too few sources the first five do not fill from the newest')
          need(any(x['h'] == 'Cardinals stun Cowboys in overtime' and x['x'] == 1 for x in d['ARI']['l']), "The Athletic's league feed does not reach the Cardinals")
          need(o['status']['fan:DET']['ok'] == 0 and o['status']['fan:DET']['err'] == 'HTTP 503', 'the failed feed is not reported')
          need(any(x['h'] == 'Bo Nix cleared to play Sunday' and x['w'] and x['w'][0][1] == 'Bo Nix' for x in d['DEN']['l']), 'a short player name does not match (Bo Nix)')
          need('Vikings Practice Report: Three Return Ahead of Week 9' not in L, 'a team headline repeats in the league column from another link')
          print('team news:', len(T), 'Vikings team stories,', len(L), 'league; matching rules hold')
          PY
          # the panel and the latest line, drawn from those stored lists
          export DBD_HARNESS_HTML=pages
          php tools/view_harness.php data teamplayers MIN
          for m in 'class="dbd-panel dbd-news dbd-feature" id="news"' '<h2>Vikings news</h2>' 'href="#news">News <b>' '<h3>Vikings.com, Daily Norseman and The Athletic</h3>' 'target="_blank" rel="nofollow noopener"' '<i>Subscriber</i>' '<li class="nw-more">' '>Show more</button>' 'class="nw-p"'; do
            grep -qF "$m" pages/teamplayers-MIN.html || { echo "the Vikings news panel is missing $m"; exit 1; }
          done
          python3 -c "import sys; h=open('pages/teamplayers-MIN.html').read(); sys.exit(0 if 0 < h.find('dbd-panel dbd-roster') < h.find('dbd-panel dbd-news') else 'the news is not after the roster (2.13.0)')"
          # the offense and defense pages: news after the explorer, the newest story large (2.13.0)
          php tools/view_harness.php data team MIN
          grep -qF '<section class="dbd-around one" id="around">' pages/team-MIN.html || { echo "no news block on the offense page"; exit 1; }
          grep -qF 'class="ar-lead" href="https://example.test/vk/practice"' pages/team-MIN.html || { echo "the offense page's lead story is not the newest"; exit 1; }
          python3 -c "import sys; h=open('pages/team-MIN.html').read(); sys.exit(0 if 0 < h.find('id=\"dbd-explorer\"') < h.find('class=\"dbd-around') else 'the news block is not after the explorer')"
          if grep -q 'dbd-latest' pages/team-MIN.html; then echo "the old latest line is still under the title"; exit 1; fi
          php tools/view_harness.php data defense MIN
          grep -qF 'class="dbd-around' pages/defense-MIN.html || { echo "no news block on the defense page"; exit 1; }
          DBD_HARNESS_NEWS=/tmp/none.json php tools/view_harness.php data teamplayers MIN
          if grep -q 'dbd-news' pages/teamplayers-MIN.html; then echo "a news panel showed with nothing stored"; exit 1; fi
          DBD_HARNESS_NEWS=/tmp/none.json php tools/view_harness.php data team MIN
          if grep -q 'class="dbd-around' pages/team-MIN.html; then echo "a news block showed with nothing stored"; exit 1; fi
          echo "team news renders"
      - name: A player traded back mid-season (2.12.1)
        run: |
          # Kirk Cousins (00-0029604) came back to the Vikings mid-season; his page threw a fatal on the live site on 2026-11-12
          DBD_HARNESS_MEDIA=1 php tools/view_harness.php data player 00-0029604
      - name: Team videos and highlights (SCOPE §51)
        run: |
          set -e
          # the matching on made-up feeds (tools/fixtures/videos), no network, with the clock pinned
          export DBD_HARNESS_NOW=1793728800 DBD_HARNESS_VIDEOS=/tmp/videos.json
          php tools/view_harness.php data videos tools/fixtures/videos > /tmp/videos-out.json
          python3 - <<'PY'
          import json
          d = json.load(open('/tmp/videos.json')); o = json.load(open('/tmp/videos-out.json'))
          def need(c, m):
              if not c: raise SystemExit('videos: ' + m)
          M = [x['v'] for x in d['videos']['MIN']['v']]
          need(M == ['MINvid00001', 'NFLtwoteam1', 'NFLcapsabc1', 'MINvid00002', 'MINvid00003', 'MINprev0001', 'MINvid00004', 'MINvid00005'], f'the Vikings list is {M}')
          need('NFLcapsabc1' in [x['v'] for x in d['videos']['CHI']['v']], 'a title in capitals does not reach its teams')
          need(o['found'] == 2 and len(o['playlist_errors']) == 1 and 'Week 6' in o['playlist_errors'][0], f"a recap playlist that fails is not reported: {o['playlist_errors']}")
          need(not any('short' in v for v in M), 'a Short was kept')
          need('MINold00001' not in M and 'MINprevold1' not in M, 'a video older than 14 days was kept')
          need(M.count('MINvid00002') == 1, 'a video stored last pass and fetched again shows twice')
          need([x['v'] for x in d['videos']['GB']['v']] == ['NFLtwoteam1'], 'an NFL video naming two teams does not reach both')
          need(all(x['v'] != 'NFLroundup1' for t in d['videos'] for x in d['videos'][t]['v']), 'an NFL roundup naming four teams was kept')
          need(all(x['v'] != 'NFLcollege1' for t in d['videos'] for x in d['videos'][t]['v']), '"Minnesota" alone matched the Vikings')
          need(o['status']['yt:DET']['ok'] is False and o['status']['yt:DET']['err'] == 'HTTP 503', 'the failed channel is not reported')
          need(o['playlists'] == {'7': 'PLrecaps07xx', '6': 'PLrecaps06xx'}, f"the playlists found are {o['playlists']}")
          H = o['highlights']
          need(H.get('2026_07_NE_CHI', {}).get('v') == 'HLneatchi01' and H.get('2026_07_PIT_NO', {}).get('v') == 'HLpitno0001', f'the Week 7 highlights are {H}')
          need('2026_07_SF_ATL' not in H and '2026_07_CIN_BAL' not in H, 'a video from another week, or one that is not highlights, was matched')
          need(o['missing_first'] and o['missing_first'] == sorted(o['missing_first'], reverse=True), 'the weeks to look up are not newest first')
          need(set(o['missing_after']) < set(o['missing_first']), 'once some highlights are stored, old weeks are still looked up every pass')
          # the NFL's previews and player highlights (2.14.0, SCOPE §54)
          A = o['all_playlists']
          need(A['preview'] == {'7': 'PLprev07xxxx'} and A['player'] == {'7': 'PLplayers07x', '6': 'PLplayers06x'}, f'the weekly playlists found are {A}')
          need(o['previews'] == {'2026_07_NE_CHI': o['previews'].get('2026_07_NE_CHI')} and o['previews']['2026_07_NE_CHI']['v'] == 'PVneatchi01', f"the Week 7 previews are {o['previews']}")
          need(list(o['players']) == ['00-0036322'] and o['players']['00-0036322']['7']['v'] == 'PHjj0000001', f"the player highlights are {o['players']}")
          need(o['defense'] == {'CHI': o['defense'].get('CHI')} and o['defense']['CHI']['7']['v'] == 'PHbearsdef1', f"the team defense videos are {o['defense']}")
          need(any('Week 6 player highlights' in e for e in o['other_errors']), f"a player playlist that fails is not reported: {o['other_errors']}")
          print('videos:', len(M), 'Vikings videos,', len(H), 'highlights; matching rules hold')
          PY
          export DBD_HARNESS_HTML=pages DBD_HARNESS_MEDIA=1
          php tools/view_harness.php data teamplayers MIN
          for m in 'class="dbd-panel dbd-vids dbd-feature" id="videos"' '<h2>Vikings videos</h2>' 'href="#videos">Videos <b>8</b>' 'href="https://www.youtube.com/watch?v=MINvid00001" target="_blank" rel="noopener"' 'https://i.ytimg.com/vi/MINvid00001/hqdefault.jpg' 'https://i.ytimg.com/vi/NFLtwoteam1/mqdefault.jpg' 'class="dbd-vid vd-more"' '>Show more</button>' 'NFL · '; do
            grep -qF "$m" pages/teamplayers-MIN.html || { echo "the Vikings videos panel is missing $m"; exit 1; }
          done
          python3 -c "import sys; h=open('pages/teamplayers-MIN.html').read(); sys.exit(0 if 0 < h.find('dbd-panel dbd-roster') < h.find('dbd-panel dbd-vids') and ( h.find('dbd-panel dbd-news') < 0 or h.find('dbd-panel dbd-vids') < h.find('dbd-panel dbd-news') ) else 'the videos are not after the roster and before the news (2.13.0)')"
          php tools/view_harness.php data team MIN
          grep -qF '<div class="ar-vid"><h2 class="ar-t">Newest video</h2><a class="dbd-play" href="https://www.youtube.com/watch?v=MINvid00001"' pages/team-MIN.html || { echo "the offense page's newest video is missing"; exit 1; }
          if grep -q 'youtube-nocookie.com/embed\|<iframe' pages/teamplayers-MIN.html; then echo "an embedded player on the page: the NFL and teams block them (2.13.1)"; exit 1; fi
          php tools/view_harness.php data game 2026_07_PIT_NO
          grep -qF '<h2 class="ar-t">The highlights</h2>' pages/game-2026_07_PIT_NO.html && grep -qF 'href="https://www.youtube.com/watch?v=HLpitno0001"' pages/game-2026_07_PIT_NO.html || { echo "the game has no highlights"; exit 1; }
          php tools/view_harness.php data game 2026_07_SF_ATL
          if grep -q 'The highlights</h2>\|Watch the highlights' pages/game-2026_07_SF_ATL.html; then echo "a game without its recap shows highlights"; exit 1; fi
          # SCOPE §55: Keys to the game in the offense's colors; the Vikings are the away offense here, purple and gold
          php tools/view_harness.php data game 2026_08_MIN_DET
          grep -qF 'class="dbd-panel dbd-keys tm" style="--k-bg:#4f2683;--k-ac:#ffc62f"' pages/game-2026_08_MIN_DET.html || { echo "the keys panel is not in the Vikings colors"; exit 1; }
          grep -qF '<span class="kt">Vikings offense</span>' pages/game-2026_08_MIN_DET.html || { echo "the keys header does not name the offense"; exit 1; }
          # SCOPE §62: Before the NFL on a player page, from a copy of the data with a draft, combine and Wikipedia record added
          rm -rf /tmp/dd && cp -r data /tmp/dd
          python3 -c "import json; f='/tmp/dd/players/MIN.json'; d=json.load(open(f)); p=[x for x in d['players'] if x['id']=='00-0036322'][0]; p['bf']={'dr':{'y':2020,'r':1,'p':22,'t':'MIN','sc':'LSU','pos':'WR','k':5,'n':35,'b':['Henry Ruggs III','Jerry Jeudy','CeeDee Lamb','Jalen Reagor'],'pb':4,'ap':2,'hof':False},'cb':{'y':2020,'g':'WR','d':[['ht',73,44],['wt',202,50],['forty',4.43,74],['bench',None,None],['vertical',37.5,72],['broad_jump',126,77],['cone',None,None],['shuttle',None,None]],'sc':74,'nr':3}}; p['wk']=['Justin Jefferson','American football player (born 1999)','Justin Jamal Jefferson is an American professional football wide receiver.']; json.dump(d, open(f,'w'))"
          php tools/view_harness.php /tmp/dd player 00-0036322
          f=$(ls -t pages/player-*.html | head -1)
          grep -qF 'id="dbd-before"' $f && grep -qF 'Round 1 · Pick 22' $f && grep -qF '4.43s' $f && grep -qF 'Score 74 of 100' $f || { echo "the Before the NFL band is missing a piece"; exit 1; }
          grep -qF 'href="https://en.wikipedia.org/wiki/Justin_Jefferson"' $f && grep -qF 'CC BY-SA 4.0' $f && grep -qF '>Draft and combine</a>' $f || { echo "the Wikipedia link or credit is missing"; exit 1; }
          # SCOPE §64: the Wikipedia article as sameAs, the search title, and the Related panel with his draft class
          python3 tools/check_ld.py $f Person 'https://en.wikipedia.org/wiki/Justin_Jefferson' || exit 1
          grep -qF '<title>Justin Jefferson stats 2026: targets, snaps, EPA | Down by Down</title>' $f || { echo "the player title is not the search title"; exit 1; }
          grep -qF 'class="dbd-panel dbd-related"' $f && grep -qF '>The 2020 draft class</a>' $f && grep -qF '>Wide receivers leaders</a>' $f && grep -qF '>Vikings offense</a>' $f || { echo "the Related panel is missing a link"; exit 1; }
          python3 -c "import sys; h=open('$f').read(); sys.exit(0 if 0 < h.find('id=\"dbd-career\"') < h.find('id=\"dbd-before\"') < h.find('id=\"dbd-more\"') else 'Before the NFL is not between Career and Intel')"
          # without the record, no band and no pills
          php tools/view_harness.php data player 00-0036322
          f=$(ls -t pages/player-*.html | head -1)
          if grep -q 'id="dbd-before"' $f; then grep -q '"bf"' data/players/MIN.json || { echo "a band showed with no record"; exit 1; }; fi
          # SCOPE §57: the team page header is the team's panel with the four numbers
          php tools/view_harness.php data team MIN
          f=pages/team-MIN.html
          grep -qF '<header class="dbd-tpanel">' $f && grep -qF -- '--k-bg:#4f2683;--k-ac:#ffc62f' $f || { echo "the team page has no Vikings panel"; exit 1; }
          grep -qF '<h1>Vikings <span>offense</span></h1>' $f || { echo "the team panel lost its h1"; exit 1; }
          python3 -c "import sys; h=open('$f').read(); m=h[h.find('tp-mark'):h.find('tp-main')]; sys.exit(0 if 'fetchpriority=\"high\"' in m and 'loading=\"lazy\"' not in m else 'the team panel logo still loads lazily')"
          python3 -c "import sys, re; h=open('$f').read(); d=re.search(r'<dl class=\"tp-stats\">(.*?)</dl>', h, re.S); sys.exit(0 if d and d.group(1).count('<dt>') in (3, 4) and 'id=\"dbd-snaps\"' in d.group(1) and 'dbd-ttitle' not in h else 'the team panel numbers are wrong')"
          # SCOPE §56: the face-off, offense panel then game card then defense panel, each in its team's colors; the title stays the h1
          f=pages/game-2026_08_MIN_DET.html
          grep -qF '<h1 class="dbd-sr">Vikings offense vs Lions defense</h1>' $f || { echo "the game page lost its h1"; exit 1; }
          python3 -c "import sys, re; h=open('$f').read(); o=h.find('<div class=\"dbd-fside\" style=\"--k-bg:#4f2683;--k-ac:#ffc62f\"'); b=h.find('dbd-panel dbd-gamebox'); d=h.find('<div class=\"dbd-fside\"', b); k=h.find('dbd-keys tm'); sys.exit(0 if 0 < o < b < d < k and re.search(r'dbd-f(score|vs)', h[b:d]) and 'dbd-markpair' not in h[:k] else 'the face-off is out of order or missing a piece')"
          grep -qF '<span>Vikings offense</span></a><a href=' $f || { echo "the offense switch has no team names"; exit 1; }
          # the breadcrumb in title case, joining words small
          grep -qF '>Week 8</a> <span>›</span> <b>Vikings at Lions</b>' pages/game-2026_08_MIN_DET.html || { echo "the breadcrumb is not in title case"; exit 1; }
          # every team's pair passes: the panel 10:1 against white, the accent 4.5:1 on the panel
