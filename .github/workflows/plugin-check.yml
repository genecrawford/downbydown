# Plugin check: PHP syntax across the plugin and tools, and a real render of three share cards with GD.
# Runs on every pull request and by hand. The cards upload as an artifact so a reviewer can look at them.
name: Plugin check
on:
  pull_request:
  workflow_dispatch:
jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: gd
          coverage: none
      - name: Syntax check every PHP file
        run: |
          set -e
          find plugin tools -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Render the views with a WordPress shim
        run: |
          set -e
          php tools/view_harness.php data player 00-0036322
          php tools/view_harness.php data player 00-0033293
          php tools/view_harness.php data player 00-0035228
          php tools/view_harness.php data player 00-0036259
          php tools/view_harness.php data player 00-0034857
          php tools/view_harness.php data players
          php tools/view_harness.php data team MIN
          php tools/view_harness.php data game 2026_04_LA_PHI
          php tools/view_harness.php data game 2026_08_KC_DEN
          php tools/view_harness.php data game 2026_08_MIN_DET
          php tools/view_harness.php data teamplayers MIN
          php tools/view_harness.php data hub
          php tools/view_harness.php data matchups
          php tools/view_harness.php data compare 00-0036322,00-0039075
          php tools/view_harness.php data myteam
          php tools/view_harness.php data leaders
          php tools/view_harness.php data leaders wr
          php tools/view_harness.php data defense MIN
          php tools/view_harness.php data leaders def
          php tools/view_harness.php data leaders te.g.tshare
          php tools/view_harness.php data week
          php tools/view_harness.php data week 7
          php tools/view_harness.php data leaders rec.g.tshare
          php tools/view_harness.php data myteam 00-0034857,00-0039139,00-0038542,00-0036322,00-0039075,00-0037744,00-0036358,00-0037838
      - name: Team news (SCOPE §49)
        run: |
          set -e
          # the matching step on made-up feeds (tools/fixtures/news), no network, with the clock pinned
          export DBD_HARNESS_NOW=1793728800 DBD_HARNESS_NEWS=/tmp/news.json
          php tools/view_harness.php data news tools/fixtures/news > /tmp/news-out.json
          python3 - <<'PY'
          import json
          from collections import Counter
          d = json.load(open('/tmp/news.json')); o = json.load(open('/tmp/news-out.json'))
          def need(c, m):
              if not c: raise SystemExit('team news: ' + m)
          M = d['MIN']; T = [x['h'] for x in M['t']]; L = [x['h'] for x in M['l']]
          need(len(T) == 8, f'the Vikings team column has {len(T)} stories, want 8: {T}')
          need('A newer Norseman story the stale copy lacks' in T, 'a stale feed copy took away a newer stored story (2.9.1)')
          need('A Vikings.com story from eight days ago' not in T, 'a stored story older than 7 days was kept')
          need('older copy' in o['status']['fan:MIN']['err'], 'a feed that sent an older copy of itself is not flagged')
          need('A Story From Two Weeks Ago' not in T, 'a story older than 7 days was kept')
          need('NFL Week 9 Power Rankings: You decide' not in T, 'an Athletic team-feed story naming no Viking was kept')
          need('Justin Jefferson and the new shape of the offense' in T, 'an Athletic story naming a Vikings player was dropped')
          top = M['t'][:5]; c = Counter(x['s'] for x in top)
          need(max(c.values()) <= 2, f'more than two from one source in the first five: {c}')
          need([x['ts'] for x in top] == sorted((x['ts'] for x in top), reverse=True), 'the first five are not newest first')
          jj = next(x for x in M['t'] if x['h'].startswith('Justin Jefferson by'))
          need(jj['w'] and jj['w'][0][0] == '00-0036322', 'the player a headline names is not linked')
          need(all((x['x'] == 1) == (x['s'] == 'The Athletic') for x in M['t'] + M['l']), 'the Subscriber marks are wrong')
          need(L == ['Vikings plan to start the backup in Week 9', 'Lions linebacker hurt in the win over the Vikings'], f'the Vikings league column is {L}')
          need(all('Nittany' not in x['h'] for t in d for x in d[t]['l']), 'a college story matched an NFL team')
          need(all('grades' not in x['h'] for t in d for x in d[t]['l']), 'a story naming four teams matched')
          DT = [x['h'] for x in d['DET']['t']]
          need('Pride Of Detroit film study from yesterday' in DT and 'Pride Of Detroit story from ten days ago' not in DT, f'a failed feed did not carry over just its recent stories: {DT}')
          need(len(d['DET']['t']) == 7 and sum(x['s'] == 'Detroitlions.com' for x in d['DET']['t'][:5]) == 4, 'with too few sources the first five do not fill from the newest')
          need(any(x['h'] == 'Cardinals stun Cowboys in overtime' and x['x'] == 1 for x in d['ARI']['l']), "The Athletic's league feed does not reach the Cardinals")
          need(o['status']['fan:DET']['ok'] == 0 and o['status']['fan:DET']['err'] == 'HTTP 503', 'the failed feed is not reported')
          need(any(x['h'] == 'Bo Nix cleared to play Sunday' and x['w'] and x['w'][0][1] == 'Bo Nix' for x in d['DEN']['l']), 'a short player name does not match (Bo Nix)')
          need('Vikings Practice Report: Three Return Ahead of Week 9' not in L, 'a team headline repeats in the league column from another link')
          print('team news:', len(T), 'Vikings team stories,', len(L), 'league; matching rules hold')
          PY
          # the panel and the latest line, drawn from those stored lists
          export DBD_HARNESS_HTML=pages
          php tools/view_harness.php data teamplayers MIN
          for m in 'class="dbd-panel dbd-news" id="news"' '<b>Vikings news</b>' '<h3>Vikings.com, Daily Norseman and The Athletic</h3>' 'target="_blank" rel="nofollow noopener"' '<i>Subscriber</i>' '<li class="nw-more">' '>Show more</button>' 'class="nw-p"'; do
            grep -qF "$m" pages/teamplayers-MIN.html || { echo "the Vikings news panel is missing $m"; exit 1; }
          done
          php tools/view_harness.php data team MIN
          grep -qF '<p class="dbd-latest">Latest: <a href="https://example.test/vk/practice"' pages/team-MIN.html || { echo "no latest line on the offense page"; exit 1; }
          php tools/view_harness.php data defense MIN
          grep -qF 'class="dbd-latest"' pages/defense-MIN.html || { echo "no latest line on the defense page"; exit 1; }
          DBD_HARNESS_NEWS=/tmp/none.json php tools/view_harness.php data teamplayers MIN
          if grep -q 'dbd-news' pages/teamplayers-MIN.html; then echo "a news panel showed with nothing stored"; exit 1; fi
          DBD_HARNESS_NEWS=/tmp/none.json php tools/view_harness.php data team MIN
          if grep -q 'dbd-latest' pages/team-MIN.html; then echo "a latest line showed with nothing stored"; exit 1; fi
          echo "team news renders"
      - name: Render share cards
        run: |
          set -e
          php tools/card_harness.php data 00-0036322 card-wr.png
          php tools/card_harness.php data 00-0033293 card-rb.png
          php tools/card_harness.php data 00-0035228 card-qb.png
          php tools/card_harness.php data 00-0036259 card-ungraded.png
          # the 1.19.0 cards (SCOPE §43): the latest final, the next game still to play, a team, the hub and the latest week in review,
          # with logos and photos (as the live site has them) and once without, through the same render() the live route calls
          read -r FIN PRE WK <<<"$(python3 - <<'PY'
          import json, glob, re
          s = json.load(open('data/schedule.json'))
          gl = [g for w in sorted(s['weeks'], key=int) for g in s['weeks'][w]]
          fin = [g['id'] for g in gl if g['status'] == 'final']; pre = [g['id'] for g in gl if g['status'] != 'final']
          wk = max(int(re.findall(r'w(\d+)', f)[0]) for f in glob.glob('data/week/w*.json'))
          print(fin[-1], pre[0] if pre else fin[0], wk)
          PY
          )"
          echo "final $FIN, next $PRE, week $WK"
          export DBD_HARNESS_MEDIA=1 DBD_HARNESS_LOGOS=1
          php tools/view_harness.php data card "game-$FIN" card-game-final.png
          php tools/view_harness.php data card "game-$PRE" card-game-next.png
          php tools/view_harness.php data card team-MIN card-team.png
          php tools/view_harness.php data card page-hub card-page-hub.png
          php tools/view_harness.php data card "page-week-$WK" card-page-week.png
          php tools/view_harness.php data card 00-0036322 card-player-render.png
          DBD_HARNESS_LOGOS= DBD_HARNESS_MEDIA= php tools/view_harness.php data card team-DET card-team-nologos.png
          DBD_HARNESS_LOGOS= DBD_HARNESS_MEDIA= php tools/view_harness.php data card "game-$FIN" card-game-nologos.png
          for k in team-ZZZ game-2026_99_AAA_BBB page-nope; do if php tools/view_harness.php data card "$k" /tmp/x.png 2>/dev/null; then echo "card $k should not render"; exit 1; fi; done
      - uses: actions/upload-artifact@v4
        with:
          name: share-cards
          path: card-*.png
      - name: Readable URLs (SCOPE §43)
        run: |
          set -e
          export DBD_HARNESS_PRETTY=1
          # every old link to a path and back to the same route
          php tools/view_harness.php data urls
          # old links answer 301 to their path, keeping the filters and tracking a path doesn't carry
          chk() { got="$(php tools/view_harness.php data redirect "$1")"; echo "$1 -> $got"; [ "$got" = "$2" ] || { echo "  expected: $2"; exit 1; }; }
          chk '/?player=00-0036322&utm_source=x' 'redirect 301 https://example.test/player/justin-jefferson/?utm_source=x'
          chk '/?team=MIN&side=def' 'redirect 301 https://example.test/team/min/defense/'
          chk '/?view=players&pt=MIN&pos=WR&q=jeff' 'redirect 301 https://example.test/players/?pt=MIN&pos=WR&q=jeff'
          chk '/?view=leaders&b=wr.tsh' 'redirect 301 https://example.test/leaders/?b=wr.tsh'
          chk '/?myteam=00-0036322,00-0036900' 'redirect 301 https://example.test/my-team/?myteam=00-0036322%2C00-0036900'
          chk '/?game=2026_08_MIN_DET&side=home&fbclid=abc' 'redirect 301 https://example.test/game/2026-week-8-vikings-at-lions/lions/?fbclid=abc'
          chk '/?player=99-9999999' 'stays (0 warnings)'
          chk '/?card=00-0036322' 'stays (0 warnings)'
          # paths render as their pages, and their links are paths too (share cards excepted)
          export DBD_HARNESS_HTML=pathpages
          for p in /team/min/ /team/min/defense/ /team/min/players/ /player/justin-jefferson/ /player/josh-allen/ /compare/justin-jefferson/jamarr-chase/ /players/ /leaders/ /leaders/rb/ /week/ /matchups/ /teams/ /my-team/ /player/no-such-player/ /team/zzz/ /; do
            # a notfound page is short, and the harness flags short output; that one path may exit 3
            php tools/view_harness.php data path "$p" >>/tmp/paths.log 2>&1 || [ "$p" = /team/zzz/ ] || { cat /tmp/paths.log; echo "path $p failed"; exit 1; }
          done
          cat /tmp/paths.log
          if grep -E "^  warning:|FATAL" /tmp/paths.log; then exit 1; fi
          grep -q "rendered players player_no-such-player.*route players" /tmp/paths.log
          grep -q "route notfound" /tmp/paths.log
          if grep -lE 'href="[^"]*\?(player|team|game|view)=' pathpages/*.html; then echo "a query-string link survived on the pages above"; grep -ohE 'href="[^"]*\?(player|team|game|view)=[^"]*"' pathpages/*.html | sort | uniq -c | head; exit 1; fi
          grep -q 'href="https://example.test/player/' pathpages/teamplayers-team_min_players.html
          grep -q 'href="https://example.test/game/' pathpages/matchups-matchups.html
      - uses: actions/upload-artifact@v4
        with:
          name: path-pages
          path: pathpages/
      - name: The app on its own page, paths at the root (2.0.2)
        run: |
          set -e
          export DBD_HARNESS_PRETTY=1 DBD_HARNESS_ROOT=1
          # every link round-trips with the app on /hub/: the hub is /hub/, every other page a root path
          php tools/view_harness.php data urls
          chk() { got="$(php tools/view_harness.php data redirect "$1")"; echo "$1 -> $got"; [ "$got" = "$2" ] || { echo "  expected: $2"; exit 1; }; }
          # old query links on the front page land on root paths; a plain visit to the home stays
          chk '/?team=MIN' 'redirect 301 https://example.test/team/min/'
          chk '/?player=00-0036322&utm_source=x' 'redirect 301 https://example.test/player/justin-jefferson/?utm_source=x'
          chk '/?game=2026_08_MIN_DET&side=home' 'redirect 301 https://example.test/game/2026-week-8-vikings-at-lions/lions/'
          chk '/?season=2025' 'redirect 301 https://example.test/2025/'
          chk '/' 'stays (0 warnings)'
          chk '/?utm_source=x' 'stays (0 warnings)'
          chk '/?player=99-9999999' 'stays (0 warnings)'
          chk '/?season=1999&team=MIN' 'stays (0 warnings)'
          # links that carry the app page's address (2.0.1 drew these while the app sat on /hub/) forward to the root
          chk '/hub/team/min/' 'redirect 301 https://example.test/team/min/'
          chk '/hub/team/min/defense/?fbclid=abc' 'redirect 301 https://example.test/team/min/defense/?fbclid=abc'
          chk '/hub/player/justin-jefferson/' 'redirect 301 https://example.test/player/justin-jefferson/'
          chk '/hub/players/?pt=MIN&pos=WR' 'redirect 301 https://example.test/players/?pt=MIN&pos=WR'
          chk '/hub/2025/team/min/' 'redirect 301 https://example.test/2025/team/min/'
          chk '/hub/2025/' 'redirect 301 https://example.test/2025/'
          chk '/hub/team/zzz/' 'stays (0 warnings)'
      - name: Live blocks and the home sections (2.1.0+)
        run: |
          set -e
          export DBD_HARNESS_MEDIA=1 DBD_HARNESS_HTML=blockpages
          php tools/view_harness.php data block hero-map
          php tools/view_harness.php data block hero-map 'player=00-0036322'
          php tools/view_harness.php data block games
          php tools/view_harness.php data block counts
          php tools/view_harness.php data block week-highlights
          # the sections Gene pastes into Divi, with the plugin's blocks drawn in, for review
          php tools/view_harness.php data page divi/home-hero.html
          php tools/view_harness.php data page divi/home-week.html
          grep -q 'class="dbd-hb hb-week-highlights"' blockpages/page-home-week.html
          grep -q 'The play of the week' blockpages/page-home-week.html
          if grep -q 'TOUCHDOWN \[' blockpages/page-home-week.html; then echo "a tackler's bracket left in a play"; exit 1; fi
          php tools/view_harness.php data block matchup
          php tools/view_harness.php data page divi/home-matchup.html
          grep -q 'class="dbd-hb hb-matchup"' blockpages/page-home-matchup.html
          grep -q 'Open the matchup' blockpages/page-home-matchup.html
          grep -q 'class="hb-h2h"' blockpages/page-home-matchup.html
          php tools/view_harness.php data block player-card
          grep -q 'card=00-' blockpages/block-player-card.html
          php tools/view_harness.php data block movers
          php tools/view_harness.php data page divi/home-players.html
          grep -q 'class="dbd-hb hb-movers"' blockpages/page-home-players.html
          grep -q 'Rising in ' blockpages/page-home-players.html  # Week N, or a playoff round
          php tools/view_harness.php data block fantasy
          php tools/view_harness.php data block leaders
          php tools/view_harness.php data block leaders 'boards=ppr'
          php tools/view_harness.php data block teams
          php tools/view_harness.php data page divi/home-fantasy.html
          php tools/view_harness.php data page divi/home-leaders.html
          php tools/view_harness.php data page divi/home-teams.html
          [ "$(grep -o 'class="hb-soft"' blockpages/page-home-fantasy.html | wc -l)" -eq 4 ] || { echo "the fantasy block needs a defense at all four positions"; exit 1; }
          grep -q '<h3>PPR points</h3>' blockpages/page-home-fantasy.html
          [ "$(grep -o 'class="hb-board"' blockpages/page-home-leaders.html | wc -l)" -eq 3 ] || { echo "the leaders section needs its three boards"; exit 1; }
          [ "$(grep -o 'class="hb-div"' blockpages/page-home-teams.html | wc -l)" -eq 8 ] || { echo "the teams block needs all eight divisions"; exit 1; }
          php tools/view_harness.php data block newsletter-preview
          php tools/view_harness.php data page divi/home-newsletter.html
          grep -q 'Read the full week' blockpages/page-home-newsletter.html
          if grep -q 'TOUCHDOWN \[' blockpages/page-home-newsletter.html; then echo "a tackler's bracket left in the email"; exit 1; fi
      - name: Blocks across a season's edges (2.6.0)
        run: |
          set -e
          # the offseason: every game played, so the matchup block shows the last final game with its score
          cp -R data data_off
          python3 - <<'PY'
          import json
          p = 'data_off/schedule.json'; s = json.load(open(p))
          s['weeks'] = {w: [g for g in gl if g.get('status') == 'final'] for w, gl in s['weeks'].items()}
          json.dump(s, open(p, 'w'))
          PY
          DBD_HARNESS_HTML=edges php tools/view_harness.php data_off block matchup
          grep -q ' · Final' edges/block-matchup.html
          grep -q 'Open the game' edges/block-matchup.html
          # a new season's first weeks: no risers of this season yet, and too few players past the usual minimums
          cp -R data data_new
          python3 - <<'PY'
          import json
          p = 'data_new/players/movers.json'; m = json.load(open(p)); m['season'] -= 1; json.dump(m, open(p, 'w'))
          p = 'data_new/players/leaders.json'; l = json.load(open(p)); l['min'] = {k: 999 for k in l['min']}; json.dump(l, open(p, 'w'))
          PY
          DBD_HARNESS_HTML=edges php tools/view_harness.php data_new block movers
          grep -q 'Most targets in ' edges/block-movers.html
          DBD_HARNESS_HTML=edges php tools/view_harness.php data_new block player-card
          grep -q 'card=00-' edges/block-player-card.html
          DBD_HARNESS_HTML=edges php tools/view_harness.php data_new block leaders
          [ "$(grep -o 'class="hb-board"' edges/block-leaders.html | wc -l)" -eq 3 ] || { echo "the leader boards should step down to lower minimums"; exit 1; }
          grep -q 'at least ' edges/block-leaders.html  # a lowered minimum is named on the board
          # with the app on /hub/ and paths at the root, the blocks link to root paths
          DBD_HARNESS_PRETTY=1 DBD_HARNESS_ROOT=1 DBD_HARNESS_HTML=blockroot php tools/view_harness.php data page divi/home-hero.html
          if grep -oE 'href="[^"]*\?(player|team|game|view)=' blockroot/page-home-hero.html; then echo "a query-string app link in the hero"; exit 1; fi
          grep -q 'href="https://example.test/game/' blockroot/page-home-hero.html
          grep -q 'href="https://example.test/player/' blockroot/page-home-hero.html
          grep -q 'href="https://example.test/matchups/"' blockroot/page-home-hero.html
      - name: The weekly post (2.7.0)
        run: |
          set -e
          export DBD_HARNESS_MEDIA=1 DBD_HARNESS_HTML=posts
          # every complete week composes (a backfilled post leaves out next week); Week 7 is finished and fixed, so its checks hold
          for w in $(python3 -c "import json,glob,re; print(' '.join(sorted({re.search(r'w(\\d+)', f).group(1) for f in glob.glob('data/week/w*.json') if json.load(open(f)).get('complete')}, key=int)))"); do
            DBD_HARNESS_AHEAD=0 php tools/view_harness.php data post "$w"
          done
          grep -q '<h1>Week 7 in review: Giants stun Texans from 22%</h1>' posts/post-w7.html  # the build's rounding: 22.5 is 22
          [ "$(grep -o '<tr><td><a href' posts/post-w7.html | wc -l)" -eq 14 ] || { echo "Week 7 should list 14 scores"; exit 1; }
          grep -q 'Joe Burrow' posts/post-w7.html
          if grep -q 'TOUCHDOWN \[' posts/*.html; then echo "a tackler's bracket left in a post"; exit 1; fi
          if grep -q 'Next week' posts/post-w7.html; then echo "a backfilled post has no next week"; exit 1; fi
          # a week still in progress has no post yet
          open_wk="$(python3 -c "import json,glob,re; o=[re.search(r'w(\\d+)', f).group(1) for f in glob.glob('data/week/w*.json') if not json.load(open(f)).get('complete')]; print(o[0] if o else '')")"
          if [ -n "$open_wk" ]; then php tools/view_harness.php data post "$open_wk" | grep -q 'none'; fi
          # once its season is archived, a post's links carry the season; a game's link already names it
          DBD_HARNESS_PRETTY=1 DBD_HARNESS_ROOT=1 DBD_HARNESS_OLD_SEASON=2026 DBD_HARNESS_HTML=oldposts php tools/view_harness.php data post 7
          grep -q 'href="https://example.test/2026/team/' oldposts/post-w7.html
          grep -q 'href="https://example.test/2026/week/7/"' oldposts/post-w7.html
          grep -q 'href="https://example.test/game/2026-week-7-' oldposts/post-w7.html
          if grep -q 'href="https://example.test/team/' oldposts/post-w7.html; then echo "a link without its season"; exit 1; fi
          grep -q 'href="https://example.test/about/"' oldposts/post-w7.html  # a link Gene adds to one of his own pages keeps its address
          # the sitemap lists the week pages and the leaders (2.7.0)
          DBD_HARNESS_PRETTY=1 DBD_HARNESS_ROOT=1 php tools/view_harness.php data sitemap > sitemap.txt
          grep -qx 'https://example.test/week/7/' sitemap.txt
          grep -qx 'https://example.test/leaders/' sitemap.txt
          grep -qx 'https://example.test/leaders/wr/' sitemap.txt
          echo "sitemap: $(wc -l < sitemap.txt) URLs"
      - name: The Tuesday email (2.10.0, SCOPE §48)
        run: |
          set -e
          export DBD_HARNESS_MEDIA=1 DBD_HARNESS_PRETTY=1 DBD_HARNESS_ROOT=1 DBD_HARNESS_HTML=emails
          # every complete week's post builds into an email (the harness also checks the one-day send window)
          for w in $(python3 -c "import json,glob,re; print(' '.join(sorted({re.search(r'w(\\d+)', f).group(1) for f in glob.glob('data/week/w*.json') if json.load(open(f)).get('complete')}, key=int)))"); do
            DBD_HARNESS_AHEAD=0 php tools/view_harness.php data email "$w" | tee -a email.txt
          done
          if grep -q 'preview ""' email.txt; then echo "an email without its preview line"; exit 1; fi
          for f in emails/email-w*.html; do
            b=$(wc -c < "$f"); [ "$b" -lt 100000 ] || { echo "$f is $b bytes: Gmail cuts an email off past 102 KB"; exit 1; }
            grep -q 'href="{{ unsubscribe }}"' "$f" || { echo "$f has no unsubscribe link"; exit 1; }
            grep -q '808 Lady Street, Suite D, Columbia, SC 29201' "$f" || { echo "$f has no postal address"; exit 1; }
            if grep -o 'href="[^"]*"' "$f" | grep -v 'href="https://' | grep -qv 'unsubscribe'; then echo "$f has a link that isn't a full https address"; grep -o 'href="[^"]*"' "$f" | grep -v 'href="https://' ; exit 1; fi
            if grep -o 'class="[^"]*"' "$f" | grep -qvE 'class="(dxp|dxh)"'; then echo "$f kept a site class (its styles must be inline)"; exit 1; fi
            if grep -qE '<script|<div class|<table class' "$f"; then echo "$f kept site markup"; exit 1; fi
          done
          f=emails/email-w7.html
          grep -q 'Week 7 in review: Giants stun Texans from 22%' "$f"
          [ "$(grep -o 'padding:9px 0;border-top' "$f" | wc -l)" -eq 14 ] || { echo "the Week 7 email should list 14 scores"; exit 1; }
          grep -q 'Joe Burrow' "$f"
          grep -q '>Every play from Week 7</a>' "$f"
          grep -q 'href="https://example.test/week/7/"' "$f"
          grep -q 'href="https://example.test/leaders/"[^>]*>Fantasy leaders all season, by position</a>' "$f"  # fantasy is the leaders' first board
          grep -q 'href="https://example.test/players/"[^>]*>Every player’s season, by position</a>' "$f"
          grep -q '>Follow your own players on My team</a>' "$f"
          if grep -q 'the week page' "$f"; then echo "the post's closing line belongs to the site, the email has its button"; exit 1; fi
          grep -q 'href="{{ doubleoptin }}"' emails/confirm.html
          # the "You're in" note (2.10.2): the viewed week post's body only, once, with no loop (Divi's Post Content module)
          php tools/view_harness.php data joined
          # the admin page (2.11.0): every tab draws with its boxes, no form inside another
          DBD_HARNESS_HTML=admin php tools/view_harness.php data admin all
          # the send path (2.11.1) against a fake Brevo: no campaign tag, the one-day window, Try again and its guards
          php tools/view_harness.php data send
