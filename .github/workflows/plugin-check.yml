          php tools/view_harness.php data defense CHI
          grep -qF '<h2 class="ar-t">Defense highlights</h2>' pages/defense-CHI.html || { echo "no team defense video on the defense page"; exit 1; }
          grep -qF 'class="dbd-hop' pages/defense-CHI.html || { echo "no News and Videos links under the defense page title"; exit 1; }
          php tools/view_harness.php data teamplayers MIN
          grep -qF 'class="dbd-slot s1" title="First on the Vikings depth chart at QB: the starter">QB1</span>' pages/teamplayers-MIN.html || { echo "no depth chip for the starter"; exit 1; }
          if grep -qE '</a><small>[A-Z]+[0-9]</small>' pages/teamplayers-MIN.html; then echo "the old depth label is still there"; exit 1; fi
          DBD_HARNESS_HTML=emails php tools/view_harness.php data email 7 > /dev/null
          [ "$(grep -o '>Highlights</a>' emails/email-w7.html | wc -l)" -eq 2 ] || { echo "the Week 7 email should link 2 recaps"; exit 1; }
          DBD_HARNESS_VIDEOS=/tmp/none.json php tools/view_harness.php data teamplayers MIN
