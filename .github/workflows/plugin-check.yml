          p = 'data_new/players/leaders.json'; l = json.load(open(p)); l['min'] = {k: 999 for k in l['min']}; json.dump(l, open(p, 'w'))
          PY
          DBD_HARNESS_HTML=edges php tools/view_harness.php data_new block movers
          grep -q 'Most targets in ' edges/block-movers.html
          DBD_HARNESS_HTML=edges php tools/view_harness.php data_new block player-card
          grep -q 'card=00-' edges/block-player-card.html
          DBD_HARNESS_HTML=edges php tools/view_harness.php data_new block leaders
          [ "$(grep -o 'class="hb-board"' edges/block-leaders.html | wc -l)" -eq 3 ] || { echo "the leader boards should step down to lower minimums"; exit 1; }
          grep -q 'at least ' edges/block-leaders.html  # a lowered minimum is named on the board
          # with the app on /hub/ and paths at the root, the blocks link to root paths
          DBD_HARNESS_PRETTY=1 DBD_HARNESS_ROOT=1 DBD_HARNESS_HTML=blockroot php tools/view_harness.php data page divi/home-hero.html
          if grep -oE 'href="[^"]*\?(player|team|game|view)=' blockroot/page-home-hero.html; then echo "a query-string app link in the hero"; exit 1; fi
          grep -q 'href="https://example.test/game/' blockroot/page-home-hero.html
          grep -q 'href="https://example.test/player/' blockroot/page-home-hero.html
          grep -q 'href="https://example.test/matchups/"' blockroot/page-home-hero.html
      - name: The weekly post (2.7.0)
        run: |
          set -e
          export DBD_HARNESS_MEDIA=1 DBD_HARNESS_HTML=posts
          # every complete week composes (a backfilled post leaves out next week); Week 7 is finished and fixed, so its checks hold
          for w in $(python3 -c "import json,glob,re; print(' '.join(sorted({re.search(r'w(\\d+)', f).group(1) for f in glob.glob('data/week/w*.json') if json.load(open(f)).get('complete')}, key=int)))"); do
            DBD_HARNESS_AHEAD=0 php tools/view_harness.php data post "$w"
          done
          grep -qE '<h1>Week 7 in review: Giants stun Texans from [0-9]{1,2}%</h1>' posts/post-w7.html  # the percent follows nflverse's win model, which they re-run for past weeks (22% became 19% on Nov 17)
          [ "$(grep -o '<tr><td><a href' posts/post-w7.html | wc -l)" -eq 14 ] || { echo "Week 7 should list 14 scores"; exit 1; }
          grep -q 'Joe Burrow' posts/post-w7.html
          if grep -q 'TOUCHDOWN \[' posts/*.html; then echo "a tackler's bracket left in a post"; exit 1; fi
          if grep -q 'Next week' posts/post-w7.html; then echo "a backfilled post has no next week"; exit 1; fi
          # a week still in progress has no post yet
          open_wk="$(python3 -c "import json,glob,re; o=[re.search(r'w(\\d+)', f).group(1) for f in glob.glob('data/week/w*.json') if not json.load(open(f)).get('complete')]; print(o[0] if o else '')")"
          if [ -n "$open_wk" ]; then php tools/view_harness.php data post "$open_wk" | grep -q 'none'; fi
          # once its season is archived, a post's links carry the season; a game's link already names it
          DBD_HARNESS_PRETTY=1 DBD_HARNESS_ROOT=1 DBD_HARNESS_OLD_SEASON=2026 DBD_HARNESS_HTML=oldposts php tools/view_harness.php data post 7
          grep -q 'href="https://example.test/2026/team/' oldposts/post-w7.html
          grep -q 'href="https://example.test/2026/week/7/"' oldposts/post-w7.html
          grep -q 'href="https://example.test/game/2026-week-7-' oldposts/post-w7.html
          if grep -q 'href="https://example.test/team/' oldposts/post-w7.html; then echo "a link without its season"; exit 1; fi
          grep -q 'href="https://example.test/about/"' oldposts/post-w7.html  # a link Gene adds to one of his own pages keeps its address
          # the sitemap lists the week pages and the leaders (2.7.0)
          DBD_HARNESS_PRETTY=1 DBD_HARNESS_ROOT=1 php tools/view_harness.php data sitemap > sitemap.txt
          grep -qx 'https://example.test/week/7/' sitemap.txt
          grep -qx 'https://example.test/leaders/' sitemap.txt
          grep -qx 'https://example.test/leaders/wr/' sitemap.txt
          echo "sitemap: $(wc -l < sitemap.txt) URLs"
          # SCOPE §64: lastmod on this season's pages, a final game's own date, none on the old board years
          DBD_HARNESS_LASTMOD=1 DBD_HARNESS_PRETTY=1 DBD_HARNESS_ROOT=1 php tools/view_harness.php data sitemap > sitemap-lm.txt
          python3 - <<'PY'
          import json, re, sys
          m = json.load(open('data/manifest.json')); bt = m['built_at'][:10]
          L = dict(l.split(' ', 1) for l in open('sitemap-lm.txt').read().split('\n') if l)
          bad = []
          if not L['https://example.test/leaders/'].startswith(bt): bad.append('leaders page lastmod is not the build time')
          if L.get('https://example.test/draft/1980/') != '-': bad.append('an old draft year carries a lastmod')
          if not L['https://example.test/draft/2026/'].startswith(bt): bad.append('the newest draft lacks the build time')
          fin = [k for k, v in L.items() if '/game/' in k and re.fullmatch(r'\d{4}-\d\d-\d\d', v)]
          if not fin: bad.append('no final game carries its own date')
          print('lastmod: %d entries, %d final-game dates' % (len(L), len(fin)))
          sys.exit('; '.join(bad) if bad else 0)
          PY
      - name: The Tuesday email (2.10.0, SCOPE §48)
        run: |
          set -e
          export DBD_HARNESS_MEDIA=1 DBD_HARNESS_PRETTY=1 DBD_HARNESS_ROOT=1 DBD_HARNESS_HTML=emails
          # every complete week's post builds into an email (the harness also checks the one-day send window)
          for w in $(python3 -c "import json,glob,re; print(' '.join(sorted({re.search(r'w(\\d+)', f).group(1) for f in glob.glob('data/week/w*.json') if json.load(open(f)).get('complete')}, key=int)))"); do
            DBD_HARNESS_AHEAD=0 php tools/view_harness.php data email "$w" | tee -a email.txt
          done
          if grep -q 'preview ""' email.txt; then echo "an email without its preview line"; exit 1; fi
          for f in emails/email-w*.html; do
            b=$(wc -c < "$f"); [ "$b" -lt 100000 ] || { echo "$f is $b bytes: Gmail cuts an email off past 102 KB"; exit 1; }
            grep -q 'href="{{ unsubscribe }}"' "$f" || { echo "$f has no unsubscribe link"; exit 1; }
            grep -q '808 Lady Street, Suite D, Columbia, SC 29201' "$f" || { echo "$f has no postal address"; exit 1; }
            if grep -o 'href="[^"]*"' "$f" | grep -v 'href="https://' | grep -qv 'unsubscribe'; then echo "$f has a link that isn't a full https address"; grep -o 'href="[^"]*"' "$f" | grep -v 'href="https://' ; exit 1; fi
            if grep -o 'class="[^"]*"' "$f" | grep -qvE 'class="(dxp|dxh)"'; then echo "$f kept a site class (its styles must be inline)"; exit 1; fi
            if grep -qE '<script|<div class|<table class' "$f"; then echo "$f kept site markup"; exit 1; fi
          done
          f=emails/email-w7.html
          grep -qE 'Week 7 in review: Giants stun Texans from [0-9]{1,2}%' "$f"
          [ "$(grep -o 'padding:9px 0;border-top' "$f" | wc -l)" -eq 14 ] || { echo "the Week 7 email should list 14 scores"; exit 1; }
          grep -q 'Joe Burrow' "$f"
          grep -q '>Every play from Week 7</a>' "$f"
          grep -q 'href="https://example.test/week/7/"' "$f"
          grep -q 'href="https://example.test/leaders/"[^>]*>Fantasy leaders all season, by position</a>' "$f"  # fantasy is the leaders' first board
          grep -q 'href="https://example.test/players/"[^>]*>Every player’s season, by position</a>' "$f"
          grep -q '>Follow your own players on My team</a>' "$f"
          if grep -q 'the week page' "$f"; then echo "the post's closing line belongs to the site, the email has its button"; exit 1; fi
          grep -q 'href="{{ doubleoptin }}"' emails/confirm.html
          # the "You're in" note (2.10.2): the viewed week post's body only, once, with no loop (Divi's Post Content module)
          php tools/view_harness.php data joined
          # the admin page (2.11.0): every tab draws with its boxes, no form inside another
          DBD_HARNESS_HTML=admin php tools/view_harness.php data admin all
          # Growth (2.25.0, SCOPE §65): the list-size change, the 90-day record, the email line, and no Brevo call without a key
          php tools/view_harness.php data growth
          grep -q "'down-by-down-growth', 'Growth'" plugin/down-by-down/includes/admin/settings.php
          # the share pack (2.27.0, SCOPE §68): the items, keys, X lengths and helpers; both new cards draw, with and without logos; bad keys don't
          php tools/view_harness.php data pack
          # the share pack email (2.28.0, SCOPE §69): booking, the email, one copy per person, retries for whoever Brevo refused
          DBD_HARNESS_HTML=emails php tools/view_harness.php data packmail
          # Instagram posts itself (2.34.0, SCOPE §76): slots, captions, booking, a fake API, no double posts, retries, the token, JPEG squares
          php tools/view_harness.php data igpost
          # Auto publish (2.38.0, SCOPE §81): the Bluesky text and link facet, connecting, a fake Bluesky (once only, a lost reply, an expired session,
          # a card too big), the button's networks and states, an Instagram day taken over and dropped, pass rushers and a keys side on Instagram
          php tools/view_harness.php data autopub
          grep -q "add_action( 'admin_post_dbd_auto_publish'" plugin/down-by-down/includes/class-dbd-autopub.php
          grep -q "'down-by-down-share', 'Share pack'" plugin/down-by-down/includes/admin/settings.php
          node --check plugin/down-by-down/assets/pack.js
          # the events: share from the card button and both copy-link buttons; sign_up once per session on the confirmed landing
          grep -q "window.dbdTrack('share', { method: a.dataset.sheet === '1' ? 'share_sheet' : 'image'" plugin/down-by-down/assets/dbd-site.js
          grep -q "dbdTrack('share', { method: 'copy_link', content_type: 'compare'" plugin/down-by-down/assets/compare.js
          grep -q "dbdTrack('share', { method: 'copy_link', content_type: 'my_team'" plugin/down-by-down/assets/myteam.js
          php tools/view_harness.php data joined_js | grep -q "gtag('event','sign_up',{method:'email'})"
          node --check plugin/down-by-down/assets/growth.js
          # growth.js against canned Site Kit answers and a refused read: the requests it makes and the figures it draws (Greptile, PR #119)
          node tools/growth_test.js plugin/down-by-down/assets/growth.js
          # the signup strip and board emails (2.26.0, SCOPE §66): the calendar line, when the strip shows, the board-email decision, both emails
          DBD_HARNESS_HTML=emails php tools/view_harness.php data signup
          node --check plugin/down-by-down/assets/sign.js
          grep -q "gtag('event', 'generate_lead', { form: 'signup'" plugin/down-by-down/assets/sign.js
          # the strip, last on game, player, kicker and board pages when the email is set up, and absent when it isn't
          for v in "game game 2026_09_DEN_CAR" "player player 00-0036322" "draft path draft/2026/" "combine path combine/2026/"; do
            set -- $v; DBD_HARNESS_SIGN=1 DBD_HARNESS_HTML=signpages/$1 php tools/view_harness.php data $2 $3 > /dev/null
            grep -q 'id="dbd-sign" data-type="'$1'"' signpages/$1/*.html || { echo "no signup strip on $1"; exit 1; }
            grep -q '<section class="dbd-sign" id="dbd-sign" data-type="'$1'"><span class="k">The email: ' signpages/$1/*.html || { echo "the signup isn't the dark box on $1"; exit 1; }
            case $1 in
              draft|combine) grep -q '<div class="bd-pair"><a class="bd-next" [^>]*>.*</a><section class="dbd-sign" id="dbd-sign" data-type="'$1'">.*</section></div></main>' signpages/$1/*.html || { echo "the next board and the signup aren't paired last on $1"; exit 1; } ;;
              *) grep -q '<section class="dbd-sign" id="dbd-sign" data-type="'$1'">.*</section></main>' signpages/$1/*.html || { echo "the signup isn't last on $1"; exit 1; } ;;
            esac
          done
          DBD_HARNESS_HTML=nosign php tools/view_harness.php data game 2026_09_DEN_CAR > /dev/null
          if grep -q 'id="dbd-sign"' nosign/*.html; then echo "a strip without the email set up"; exit 1; fi
          # the swing card in the post and the email, and the forward line
          DBD_HARNESS_SWING=1 DBD_HARNESS_AHEAD=0 DBD_HARNESS_HTML=swing php tools/view_harness.php data post 7 > /dev/null
          grep -q '<p class="swing"><a href="https://example.test/game/' swing/post-w7.html || { echo "no swing card in the post"; exit 1; }
          DBD_HARNESS_SWING=1 DBD_HARNESS_AHEAD=0 DBD_HARNESS_HTML=swing php tools/view_harness.php data email 7 > /dev/null
          grep -q 'width="544" alt="The ' swing/email-w7.html || { echo "no swing card in the email"; exit 1; }
          grep -q 'Know someone who’d like this?' swing/email-w7.html
          grep -q 'href="https://example.test/week-7-in-review/#dbd-sign"' swing/email-w7.html
          # the send path (2.11.1) against a fake Brevo: no campaign tag, the one-day window, Try again and its guards
          php tools/view_harness.php data send 8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tuesday-emails
