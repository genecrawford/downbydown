# Plugin check: PHP syntax across the plugin and tools, and a real render of three share cards with GD.
# Runs on every pull request and by hand. The cards upload as an artifact so a reviewer can look at them.
name: Plugin check
on:
  pull_request:
  workflow_dispatch:
jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: gd
          coverage: none
      - name: Syntax check every PHP file
        run: |
          set -e
          find plugin tools -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Render the views with a WordPress shim
        run: |
          set -e
          php tools/view_harness.php data player 00-0036322
          php tools/view_harness.php data player 00-0033293
          php tools/view_harness.php data player 00-0035228
          php tools/view_harness.php data player 00-0036259
          php tools/view_harness.php data players
          php tools/view_harness.php data team MIN
          php tools/view_harness.php data hub
      - name: Render share cards
        run: |
          set -e
          php tools/card_harness.php data 00-0036322 card-wr.png
          php tools/card_harness.php data 00-0033293 card-rb.png
          php tools/card_harness.php data 00-0035228 card-qb.png
          php tools/card_harness.php data 00-0036259 card-ungraded.png
      - uses: actions/upload-artifact@v4
        with:
          name: share-cards
          path: card-*.png
      - name: Render pages for review (headshots and logos on, the theme's table rule on)
        run: |
          set -e
          # the repo's team data gains logo URLs at the next nightly build; add them here so the logo path renders now
          curl -sSL -o teams.csv https://github.com/nflverse/nflverse-data/releases/download/teams/teams_colors_logos.csv
          pip install --quiet pillow
          python3 - <<'PY'
          import csv, json, io, urllib.request
          from PIL import Image
          t = json.load(open('data/teams.json')); r = {x['team_abbr']: x for x in csv.DictReader(open('teams.csv'))}
          for k, v in t.items():
              if k in r and not v.get('logo'): v['logo'] = r[k]['team_logo_espn']
              if v.get('logo') and not v.get('logo_s'):
                  im = Image.open(io.BytesIO(urllib.request.urlopen(v['logo'], timeout=20).read())).convert('RGBA')
                  bb = im.getchannel('A').point(lambda a: 255 if a > 20 else 0).getbbox()
                  fw = (bb[2] - bb[0]) / im.width; fh = (bb[3] - bb[1]) / im.height
                  v['logo_s'] = round(max(0.7, min(1.5, min((0.6 / max(fw * fh, 0.05)) ** 0.5, 1.35 / max(fw, fh)))), 2)
          json.dump(t, open('data/teams.json', 'w'))
          print(' '.join(k + '=' + str(v.get('logo_s')) for k, v in sorted(t.items())))
          PY
          export DBD_HARNESS_MEDIA=1 DBD_HARNESS_HTML=pages DBD_HARNESS_LOGOS=1
          php tools/view_harness.php data player 00-0036322
          php tools/view_harness.php data player 00-0033293
          php tools/view_harness.php data players
          php tools/view_harness.php data hub
          php tools/card_harness.php data 00-0036322 pages/card-logo.png
      - uses: actions/upload-artifact@v4
        with:
          name: pages
          path: pages/
