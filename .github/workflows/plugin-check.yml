          fi
          # the player page: the pill, the game log mark, the block at the end
          php tools/view_harness.php data player 00-0036322
          f=pages/player-00-0036322.html
          grep -qF 'class="dbd-vmk dbd-pill" href="https://www.youtube.com/watch?v=PHjj0000001"' $f || { echo "no highlights pill"; exit 1; }
          grep -qF '>Week 7 highlights</a>' $f || { echo "the pill does not name the week"; exit 1; }
          grep -qF 'class="dbd-vmk gl" href="https://www.youtube.com/watch?v=PHjj0000001"' $f || { echo "no Highlights mark in the game log"; exit 1; }
          grep -qF '<h2 class="ar-t">His highlights</h2>' $f || { echo "no highlights at the end of the player page"; exit 1; }
          if grep -qF '.dbd .dbd-jump{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0}' plugin/down-by-down/assets/dbd.css; then echo "the player page's section bar is still restyled by 2.13.0's rule"; exit 1; fi
          # the matchups list, the week page, the defense page, the roster, the email
          php tools/view_harness.php data matchups 7
          [ "$(grep -o 'class="dbd-vmk sl"' pages/matchups-7.html | wc -l)" -eq 2 ] || { echo "the Week 7 matchups should mark 2 recaps"; exit 1; }
          php tools/view_harness.php data week 7
