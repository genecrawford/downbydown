# Plugin check: PHP syntax across the plugin and tools, and a real render of three share cards with GD.
# Runs on every pull request and by hand. The cards upload as an artifact so a reviewer can look at them.
name: Plugin check
on:
  pull_request:
  workflow_dispatch:
jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: gd
          coverage: none
      - name: Syntax check every PHP file
        run: |
          set -e
          find plugin tools -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: The playoffs (SCOPE §88)
        run: php tools/view_harness.php data playoffs x
      - name: The NFL's tiebreakers and the clinch marks (SCOPE §100)
        run: |
          set -e
          # the engine against ESPN's 2025 final table: every place, every mark
          T=$(mktemp -d); cp data/archive/2025/teams.json data/archive/2025/schedule.json "$T/"
          python3 - "$T" <<'PY'
          import json, sys
          sys.path.insert(0, 'tools'); import build_playoffs as b
          b.standings(sys.argv[1], 2025, open('tools/fixtures/espn-standings-2025.json').read())
          d = json.load(open(sys.argv[1] + '/standings.json'))
          assert d['checked'] == 'espn', d['checked']
          assert len(d['marks']) == 32 and d['marks']['DEN'] == '*' and d['marks']['SEA'] == '*' and d['marks']['MIN'] == 'e', d['marks']
          afc = d['conf']['AFC']
          assert afc[0] == ['DEN', {'p': [['common', ['NE']]]}], afc[0]
          assert afc[4] == ['HOU', {'p': [['h2h', ['BUF']]]}], afc[4]
          assert [r[0] for r in d['div']['NFC North']] == ['CHI', 'GB', 'MIN', 'DET'], d['div']['NFC North']
          assert all(len(v) == 16 for v in d['conf'].values()) and all(len(v) == 4 for v in d['div'].values())
          print('engine matches ESPN on 2025: 32 places, 32 marks')
          PY
          # the hub and a team page with this season's file, without it, and with marks
          mkdir -p /tmp/st
          test -f data/standings.json || { echo "data/standings.json is missing"; exit 1; }
          DBD_HARNESS_HTML=/tmp/st php tools/view_harness.php data hub > /dev/null
          f=$(ls -t /tmp/st/hub*.html | head -1)
          grep -qF "Seeds and division places use the NFL&#039;s tiebreakers" "$f" || { echo "the hub should say it uses the NFL's tiebreakers"; exit 1; }
          grep -qF 'class="dbd-cmkey"' "$f" || { echo "the hub should carry the key to the marks"; exit 1; }
          if grep -q 'are not applied' "$f"; then echo "the old note should be gone when standings.json is in"; exit 1; fi
          D=$(mktemp -d); cp -r data/. "$D/"; rm "$D/standings.json"; mkdir -p /tmp/st0
          DBD_HARNESS_HTML=/tmp/st0 php tools/view_harness.php "$D" hub > /dev/null
          grep -q 'are not applied' /tmp/st0/hub*.html || { echo "without standings.json the hub should keep its old order and note"; exit 1; }
          if grep -q 'dbd-cm ' /tmp/st0/hub*.html; then echo "no marks without standings.json"; exit 1; fi
          M=$(mktemp -d); cp -r data/. "$M/"; mkdir -p /tmp/stm
          python3 - "$M/standings.json" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          afc = [r[0] for r in d['conf']['AFC']]
          d['marks'] = {afc[0]: '*', afc[1]: 'x', afc[15]: 'e'}; d['since'] = {k: d['through'] for k in d['marks']}
          json.dump(d, open(sys.argv[1], 'w')); open('/tmp/stm/teams.txt', 'w').write(' '.join([afc[0], afc[15]]) + '\n')
          PY
          read TOP LAST < /tmp/stm/teams.txt
          DBD_HARNESS_HTML=/tmp/stm php tools/view_harness.php "$M" hub > /dev/null
          f=$(ls -t /tmp/stm/hub*.html | head -1)
          grep -qF 'class="dbd-cm cm-top" data-tip="Clinched the top seed and the only bye"' "$f" || { echo "the top seed should carry its mark"; exit 1; }
          grep -qF 'class="hb-out hb-gone"' "$f" || { echo "an eliminated team should be listed as eliminated"; exit 1; }
          grep -q 'class="dbd-trow dbd-elim"' "$f" || { echo "an eliminated team's division row should be greyed"; exit 1; }
          DBD_HARNESS_HTML=/tmp/stm php tools/view_harness.php "$M" team "$TOP" > /dev/null
          grep -q '<p class="tp-clinch"><abbr class="dbd-cm cm-top"' /tmp/stm/team-$TOP.html || { echo "the team page should name its mark"; exit 1; }
          grep -q 'id="dbd-kicker" data-place=" · 1st in the AFC [A-Za-z]*">[^<]* · 1st in the AFC ' /tmp/stm/team-$TOP.html || { echo "the team page should give its division place"; exit 1; }
      - name: A page for every defender (SCOPE §101)
        run: |
          set -e
          mkdir -p /tmp/df
          DBD_HARNESS_HTML=/tmp/df php tools/view_harness.php data player 00-0039924 | grep -q 'route defender' || { echo "a defender's id should route to his page"; exit 1; }
          f=/tmp/df/player-00-0039924.html
          grep -q 'class="dbd-panel dbd-dfc" data-name="Dallas Turner"' $f || { echo "his page should carry the every-play field"; exit 1; }
          grep -q '<b>Scorecard</b> · among [0-9]* pass rushers and linemen' $f || { echo "an edge rusher's Scorecard ranks him among the front"; exit 1; }
          grep -q 'id="dbd-weeks"' $f && grep -q 'id="dbd-career"' $f && grep -q '<b>His biggest plays</b>' $f || { echo "the game log, career and biggest plays should show"; exit 1; }
          grep -q 'view=leaders&[#0-9a-z;]*g=rush">Pass rushers chart</a>' $f || { echo "an edge rusher's page should link the Pass rushers tab"; exit 1; }
          DBD_HARNESS_HTML=/tmp/df php tools/view_harness.php data player 00-0035236 > /dev/null
          grep -q '<b>Scorecard</b> · among [0-9]* defensive backs' /tmp/df/player-00-0035236.html || { echo "a corner's Scorecard ranks him among the secondary"; exit 1; }
          grep -q 'Passer rating allowed' /tmp/df/player-00-0035236.html || { echo "a corner's Scorecard leads with passer rating allowed"; exit 1; }
          DBD_HARNESS_HTML=/tmp/df php tools/view_harness.php data player 00-0040624 > /dev/null
          grep -q 'not ranked: a regular role' /tmp/df/player-00-0040624.html || { echo "a backup's page should say he isn't ranked"; exit 1; }
          DBD_HARNESS_HTML=/tmp/df php tools/view_harness.php data defense MIN > /dev/null
          grep -q 'href="[^"]*?player=00-0039924"><b>Dallas Turner</b></a>' /tmp/df/defense-MIN.html || { echo "the defense tab should link its defenders"; exit 1; }
          DBD_HARNESS_HTML=/tmp/df php tools/view_harness.php data players > /dev/null
          grep -q 'id="dbd-defenders"' /tmp/df/players-*.html || { echo "the Players index should list defenders"; exit 1; }
          DBD_HARNESS_PRETTY=1 php tools/view_harness.php data path "player/dallas-turner/" | grep -q 'route defender' || { echo "/player/dallas-turner/ should route"; exit 1; }
          DBD_HARNESS_PRETTY=1 php tools/view_harness.php data sitemap | grep -q '/player/dallas-turner/' || { echo "the sitemap should list defenders with a regular role"; exit 1; }
      - name: Takeaways, the secondary's twin of Pass rushers (SCOPE §102)
        run: |
          set -e
          mkdir -p /tmp/tk
          DBD_HARNESS_HTML=/tmp/tk php tools/view_harness.php data leaders takeaways | grep -q 'route leaders' || { echo "/leaders/takeaways/ should render"; exit 1; }
          f=/tmp/tk/leaders-takeaways.html
          grep -q 'id="ld-hawks"' $f && grep -q 'id="ld-takeaways"' $f || { echo "the tab should carry the chart and the board"; exit 1; }
          grep -q 'aria-label="Passes defended a game against interceptions a game, [0-9]* defensive backs"' $f || { echo "the chart should be passes defended against interceptions"; exit 1; }
          [ "$(grep -o 'class="dbd-cbtn pr-more"' $f | wc -l)" -eq 2 ] || { echo "the chart's table and the board each get a Show all"; exit 1; }
          grep -q '<a href="[^"]*?player=[0-9-]*">' $f || { echo "names should link to their pages"; exit 1; }
          python3 - "$f" <<'PY'
          import json, os, re, sys
          h = open(sys.argv[1]).read()
          P = {}
          for n in os.listdir('data/defenders'):
              if n != 'index.json' and ' ' not in n: P.update(json.load(open('data/defenders/' + n))['players'])
          lead = max(P.values(), key=lambda p: (p['s']['int'] + p['s']['fr'], p['s']['ff'], p['s']['int']))
          say = re.findall(r'<p class="dbd-mv-say">(.*?)</p>', h)[1]
          assert lead['name'].replace("'", '&#039;') in say, ('the board should lead with the most takeaways', lead['name'], say)
          print('takeaways leader:', lead['name'], int(lead['s']['int'] + lead['s']['fr']))
          PY
          DBD_HARNESS_HTML=/tmp/tk php tools/view_harness.php data player 00-0035236 > /dev/null
          grep -q 'g=takeaways">Ball hawks chart</a>' /tmp/tk/player-00-0035236.html || { echo "a corner's page should link the Ball hawks chart"; exit 1; }
      - name: Every throw (SCOPE §90)
        run: |
          php tools/view_harness.php data throws x
          mkdir -p /tmp/thr
          DBD_HARNESS_HTML=/tmp/thr php tools/view_harness.php data game 2026_11_MIN_SF > /dev/null
          grep -q 'class="dbd-panel dbd-thr" data-kind="game"' /tmp/thr/game-2026_11_MIN_SF.html || { echo "a finished game should have the throws panel"; exit 1; }
          DBD_HARNESS_HTML=/tmp/thr php tools/view_harness.php data player 00-0029604 > /dev/null
          grep -q 'class="dbd-panel dbd-thr" data-kind="qb"' /tmp/thr/player-00-0029604.html || { echo "a quarterback's page should show the throws panel, not in a tab (2.49.1)"; exit 1; }
          if grep -q '>On the field</button>' /tmp/thr/player-00-0029604.html; then echo "a quarterback's page should have no On the field tab"; exit 1; fi
          if grep -q 'id="dbd-pmap"' /tmp/thr/player-00-0029604.html; then echo "a quarterback's page should not have the old map"; exit 1; fi
          # every target, every carry (SCOPE §98): receivers and backs get the panel too, and the old On the field tab goes (Gene: "Build, replace tab")
          for pid in 00-0036322:rx 00-0033293:rb; do id=${pid%%:*}; k=${pid##*:}
            DBD_HARNESS_HTML=/tmp/thr php tools/view_harness.php data player $id > /dev/null
            grep -q "class=\"dbd-panel dbd-thr\" data-kind=\"$k\"" /tmp/thr/player-$id.html || { echo "$id should show the $k panel"; exit 1; }
            if grep -q '>On the field</button>' /tmp/thr/player-$id.html; then echo "$id should have no On the field tab"; exit 1; fi
            if grep -q 'id="dbd-pmap"' /tmp/thr/player-$id.html; then echo "$id should not have the old map"; exit 1; fi
          done
          # the header band in his team's colors (2.57.0, SCOPE §99): Vikings purple, three buttons, players like him as chips, no side card
          f=/tmp/thr/player-00-0036322.html
          grep -q 'class="dbd-pband" style="--b1:#4F2683;--b2:#FFC62F;--bink:#ffffff;' "$f" || { echo "Jefferson's band should be Vikings purple and gold with white text"; exit 1; }
          for m in 'class="dbd-bteam"' '<a class="dbd-cmp-btn" id="dbd-cmp-btn" data-id="00-0036322"' 'class="dbd-mtbtn"' 'Add to My team' 'class="dbd-blike"><span>Compare with</span>'; do grep -qF "$m" "$f" || { echo "Jefferson's header is missing $m"; exit 1; }; done
          test "$(grep -o 'class="dbd-bchip"' "$f" | wc -l)" -eq 3 || { echo "three Compare with chips"; exit 1; }
          if grep -q 'dbd-hcard' "$f"; then echo "the old side card is gone"; exit 1; fi
          DBD_HARNESS_HTML=/tmp/thr php tools/view_harness.php data player 00-0033906 > /dev/null
          grep -q 'class="dbd-pband is-light" style="--b1:#D3BC8D;' /tmp/thr/player-00-0033906.html || { echo "a Saints page should get the light band with dark text"; exit 1; }
      - name: The weekly fantasy page (SCOPE §78)
        run: |
          set -e
          export DBD_HARNESS_HTML=pages
          # the coming week's file, as the hourly build writes it (here only; the build commits the real one), so this and every later step has it
          python3 tools/build_fan.py data --force
          N=$(python3 -c "import json; print(json.load(open('data/schedule.json'))['current_week'])")
          if [ ! -f "data/fan/w$N.json" ]; then echo "no regular-season week ahead: no fantasy page to check"; exit 0; fi
          php tools/view_harness.php data fantasy | grep -q 'route fantasy' || { echo "/fantasy/ should open the newest week"; exit 1; }
          php tools/view_harness.php data fantasy "$N"
          # what the page must hold follows the week's own file: byes only in a week with byes, rows only once there are trends (Greptile, PR #146)
          python3 - "pages/fantasy-$N.html" "$N" <<'PY'
          import json, re, sys
          h = open(sys.argv[1]).read(); N = sys.argv[2]; F = json.load(open(f'data/fan/w{N}.json')); off = set(F['byes'])
          need = ['id="fz-up"', 'id="fz-down"', 'id="fz-rz"', 'data-fxset="std"', 'data-fxset="ppr"', f'<title>Week {N} fantasy football: usage risers, red zone and matchups | Down by Down</title>', f'card=page-fantasy-{N}']
          if any(F['mu'].values()): need += ['id="fz-mu"', 'class="dbd-mvg up">Softest']
          if F['byes']: need += ['id="fz-bye"']
          if F['rz']['rb'] or F['rz']['rec']: need += ['class="fz-rz"']
          miss = [m for m in need if m not in h]
          if miss: sys.exit(f'the fantasy page is missing {miss}')
          up = h[h.index('id="fz-up"'):h.index('id="fz-rz"')]; teams = re.findall(r'class="dbd-mvr fz-r (?:up|dn)"[^>]*data-team="([A-Z]+)"', up)
          want = sum(len(F[g][p]) for g in ('risers', 'fallers') for p in ('RB', 'WR', 'TE'))
          if len(teams) != want: sys.exit(f'the page draws {len(teams)} riser and faller rows, the file has {want}')
          if off & set(teams): sys.exit(f'a team on bye is on the risers or fallers: {off & set(teams)}')
          for b in F['bye']:
              for f in ('std', 'half', 'ppr'):
                  for p in b['top'][f]:
                      if p['n'].replace("'", '&#039;') not in h: sys.exit(f"{p['n']} ({b['t']}, {f}) is missing from On bye")
          d = re.search(r'<meta name="description" content="([^"]+)"', h).group(1)
          if F['risers']['RB'] and F['risers']['RB'][0]['n'].replace("'", '&#039;') not in d: sys.exit('the description does not name the top riser: ' + d)
          print('fantasy page: %d rows, byes %s; %s' % (len(teams), sorted(off), d))
          PY
          php tools/view_harness.php data fantasy 99 | grep -q 'route notfound' || { echo "a week with no fantasy file should be not found"; exit 1; }
          DBD_HARNESS_PRETTY=1 php tools/view_harness.php data path "fantasy/week/$N/" | grep -q 'route fantasy' || { echo "/fantasy/week/$N/ should route"; exit 1; }
          grep -qF "<link rel=\"canonical\" href=\"https://example.test/fantasy/week/$N/\">" "pages/fantasy-fantasy_week_$N.html" || { echo "the fantasy page's canonical is not its week path"; exit 1; }
          DBD_HARNESS_PRETTY=1 php tools/view_harness.php data path "fantasy/x/" | grep -q 'route notfound' || { echo "/fantasy/x/ should be not found"; exit 1; }
          php tools/view_harness.php data card "page-fantasy-$N" card-page-fantasy.png
          if php tools/view_harness.php data card page-fantasy-99 /tmp/x.png 2>/dev/null; then echo "page-fantasy-99 should not render"; exit 1; fi
          php tools/view_harness.php data sitemap | grep -q "fantasy" || { echo "the sitemap does not list the fantasy page"; exit 1; }
          # links in: the week in review before it (when there is one), the Matchups chart, the hub and My team
          if [ -f "data/week/w$((N-1)).json" ]; then
            php tools/view_harness.php data week "$((N-1))" > /dev/null
            grep -qF ">Fantasy for Week $N</a>" "pages/week-$((N-1)).html" || { echo "the Week $((N-1)) review does not link the Week $N fantasy page"; exit 1; }
          fi
          php tools/view_harness.php data matchups "$N" > /dev/null
          grep -qF 'class="dbd-fxlink"' "pages/matchups-$N.html" || { echo "the Matchups fantasy chart does not link the fantasy page"; exit 1; }
          php tools/view_harness.php data hub > /dev/null
          f=$(ls -t pages/hub*.html | head -1)  # the harness names it after its default argument
          if grep -qF 'Fantasy leaders' "$f"; then grep -qF ">Week $N fantasy: risers, red zone and matchups →</a>" "$f" || { echo "the hub does not link the fantasy page"; exit 1; }; fi
          php tools/view_harness.php data myteam 00-0036322,00-0039075 > /dev/null
          grep -qF ">Week $N fantasy: risers, red zone, matchups</a>" pages/myteam-00-0036322,00-0039075.html || { echo "My team does not link the fantasy page"; exit 1; }
      - name: Pass rushers (SCOPE §79)
        run: |
          set -e
          export DBD_HARNESS_HTML=pages
          php tools/view_harness.php data leaders def > /dev/null
          if grep -q 'id="ld-rush"' pages/leaders-def.html; then echo "pass rushers belong on their own tab, not Defenses (SCOPE §80)"; exit 1; fi
          php tools/view_harness.php data leaders rush > /dev/null
          f=pages/leaders-rush.html
          python3 -c "import re,sys; h=open('$f').read(); t=re.findall(r'aria-label=\"Leaders\".*?</nav>', h, re.S)[0]; n=re.findall(r'>([^<]+)</a>', t); sys.exit(0 if n.index('Pass rushers') + 1 == n.index('Takeaways') == n.index('Defenses') - 1 and 'aria-current' in t.split('Pass rushers')[0].rsplit('<a', 1)[1] else 'the tab bar: ' + str(n))"
          # the rules worked out here on their own, then the band checked against them
          python3 - "$f" <<'PY'
          import glob, json, re, sys
          h = open(sys.argv[1]).read(); R = []
          for fn in glob.glob('data/defense/[A-Z]*.json'):
              d = json.load(open(fn)); tg = d.get('g') or 0
              for p in d.get('defenders') or d.get('players') or []:
                  g = p.get('g') or 0
                  snap = round((p.get('snap') or 0) * max(tg, g) / g) if g else 0  # the build divides by the team's games: his share in the games he played
                  if p.get('grp') in ('DL', 'LB') and g and g * 2 >= tg and snap >= 40 and (p.get('prs') or 0) >= g and p.get('id'): R.append(p)
          N = len(R)
          if N < 3: print('fewer than three rushers: no band expected'); sys.exit(0 if 'id="ld-rush"' not in h else 'a band with too few rushers')
          need = ['id="ld-rush"', 'class="pr-team"', f'{N} rushers, a game each', 'PRESSURES A GAME', 'SACKS A GAME', 'class="pr-svg wide"', 'class="pr-svg narrow"']
          if N > 10: need.append(f'Show all {N}</button>')
          miss = [m for m in need if m not in h]
          if miss: sys.exit(f'the band is missing {miss}')
          band = h[h.index('id="ld-rush"'):h.index('</section></section>', h.index('id="ld-rush"'))]
          wide = band[band.index('class="pr-svg wide"'):band.index('</svg>', band.index('class="pr-svg wide"'))]
          dots = len(re.findall(r'<g class="pr-d', wide)); rows = len(re.findall(r'<tr[ >]', band.split('<tbody>')[1])); hid = band.count('class="pr-x"')
          if dots != N or rows != N or hid != max(0, N - 10): sys.exit(f'want {N} dots and rows, {max(0, N - 10)} hidden; got {dots} dots, {rows} rows, {hid} hidden')
          x = lambda p: p['prs'] / p['g']; y = lambda p: (p.get('sk') or 0) / p['g']
          top = {p['name'] for p in sorted(R, key=lambda p: (-x(p), -y(p), p['name']))[:8]} | {p['name'] for p in sorted(R, key=lambda p: (-y(p), -x(p), p['name']))[:8]}
          named = set(re.findall(r'<text class="pr-l" [^>]*>([^<]+)</text>', wide))
          want = {n.replace("'", '&#039;') for n in top}
          if not named <= want or len(named) < len(want) - 4: sys.exit(f'named on the chart {sorted(named)}, want most of {sorted(want)}')  # a name with no clear spot is left off (SCOPE §80)
          lp = max(R, key=lambda p: (p['prs'], x(p)))['name']; ls = max(R, key=lambda p: (p.get('sk') or 0, y(p)))['name']
          say = re.search(r'<p class="dbd-mv-say">(.*?)</p>', band).group(1)
          if lp.replace("'", '&#039;') not in say or ls.replace("'", '&#039;') not in say: sys.exit('the read does not name the leaders: ' + say)
          if 'player=' not in band: sys.exit('a rusher should link to his own page (SCOPE §101)')
          hc = band.count('class="pr-h"')
          if not N <= hc <= 2 * N: sys.exit(f'{hc} highlight labels for {N} rushers on two charts')  # a team name with no clear spot is left off (Greptile, PR #148)
          if 'class="pr-team"' not in band: sys.exit('the shared Highlight menu is missing')
          print(f'pass rushers: {N} rushers, {len(top)} named, leaders {lp} and {ls}')
          PY
          # the card and the square, for the week the defense files run through; never an older week's
          W=$(python3 -c "import json; print(json.load(open('data/defense/MIN.json'))['through'])")
          php tools/view_harness.php data card "pack-week-$W-rush" card-pass-rushers.png
          # the square comes from the week's pack, which waits for the week's last game: midweek (defense through a week still being played) there's none
          if python3 -c "import json,sys; sys.exit(0 if json.load(open('data/week/w$W.json')).get('complete') else 1)" 2>/dev/null; then
            php tools/view_harness.php data card "ig-week-$W-rush" card-square-rush.png
          else
            echo "Week $W isn't finished, so no pass rushers square yet"
            if php tools/view_harness.php data card "ig-week-$W-rush" /tmp/x.png 2>/dev/null; then echo "ig-week-$W-rush should not render before Week $W is finished"; exit 1; fi
          fi
          for k in "pack-week-$((W-1))-rush" pack-week-99-rush; do if php tools/view_harness.php data card "$k" /tmp/x.png 2>/dev/null; then echo "card $k should not render"; exit 1; fi; done
      - name: A chart on every position tab (SCOPE §80)
        run: |
          set -e
          export DBD_HARNESS_HTML=pages
          for g in wr te rb qb; do php tools/view_harness.php data leaders $g > /dev/null; done
          # each chart against its board's pool, worked out here from the boards' own file
          python3 - <<'PY'
          import json, re, sys
          L = json.load(open('data/players/leaders.json')); P = L['players']
          AX = {'wr': ('tshare', 'epat'), 'te': ('tshare', 'epat'), 'rb': ('tpg', 'ypt'), 'qb': ('epadb', 'cpoe')}
          for g, (xk, yk) in AX.items():
              h = open(f'pages/leaders-{g}.html').read(); mn = L['min'][g]; G = L['groups'][g]['g']
              ys = {r[0]: r[1] for r in G[yk] if r[2] >= mn and r[0] in P}
              rows = [dict(id=r[0], n=P[r[0]][0], x=r[1], y=ys[r[0]]) for r in G[xk] if r[2] >= mn and r[0] in P and P[r[0]][1] and r[0] in ys and r[1] is not None]
              N = len(rows)
              if N < 3: print(g, 'too few for a chart'); continue
              if 'id="ld-chart"' not in h or h.index('id="ld-chart"') > h.index('class="ld-grid"'): sys.exit(f'{g}: the chart is missing or below the boards')
              band = h[h.index('id="ld-chart"'):h.index('</section></section>', h.index('id="ld-chart"'))]
              wide = band[band.index('class="pr-svg wide"'):band.index('</svg>', band.index('class="pr-svg wide"'))]
              dots = len(re.findall(r'<g class="pr-d', wide))
              if dots != N: sys.exit(f'{g}: {dots} dots, the board pool has {N}')
              hc = band.count('class="pr-h"')
              if not N <= hc <= 2 * N: sys.exit(f'{g}: {hc} highlight labels for {N} players on two charts')
              top = {r['n'] for r in sorted(rows, key=lambda r: (-r['x'], -r['y'], r['n']))[:6]} | {r['n'] for r in sorted(rows, key=lambda r: (-r['y'], -r['x'], r['n']))[:6]}
              want = {n.replace("'", '&#039;') for n in top}; named = set(re.findall(r'<text class="pr-l" [^>]*>([^<]+)</text>', wide))
              if not named <= want or len(named) < len(want) - 4: sys.exit(f'{g}: named {sorted(named)}, want most of {sorted(want)}')
              r = sorted(map(float, re.findall(r'<circle [^>]*r="([0-9.]+)"', wide)))
              if r[0] >= r[-1]: sys.exit(f'{g}: the dots should be sized by volume')
              print(f'{g}: {N} players, {len(named)} named, dots {r[0]}..{r[-1]}')
          PY
